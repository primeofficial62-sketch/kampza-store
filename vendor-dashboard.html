<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAMPZA Vendor Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF7628;--c:#252525;--bg:#fff;--g:#F4F4F4;--m:#6b6b6b;--b:#e8e8e8;--r:14px;--pad:14px;color-scheme:light}
@media(min-width:768px){:root{--pad:22px}}
*{box-sizing:border-box;margin:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{font:400 14px/1.4 Inter,system-ui,sans-serif;color:var(--c);background:var(--bg);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
body.menu{overflow:hidden}
h1,h2,h3{font-family:Sora,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding:8px 0;border-bottom:1px solid var(--b)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .ttl{flex:1;min-width:0}
.hrow b{font:700 17px Sora;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow small{color:var(--m);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--g);position:relative;flex:none}
.ib .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--o);color:#fff;font:700 10px Inter;display:grid;place-items:center;padding:0 4px}
.btn{background:var(--o);color:#fff;font-weight:600;border-radius:10px;padding:9px 14px;transition:transform .1s;text-align:center;text-decoration:none;display:inline-block}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--g);color:var(--c)}.btn.danger{background:#d92d20}.btn.sm{padding:7px 11px;font-size:13px}
.btn.full{display:block;width:100%;padding:13px;margin-top:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.dr{position:fixed;inset:0;z-index:60;pointer-events:none}
.dr .ov{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .2s}
.dr aside{position:absolute;top:0;bottom:0;left:0;width:min(84vw,310px);background:var(--bg);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:4px 0 24px #0002}
body.menu .dr{pointer-events:auto}body.menu .dr .ov{opacity:1}body.menu .dr aside{transform:none}
.dh{padding:16px;background:var(--c);color:#fff;display:flex;gap:12px;align-items:center}
.dh .av{width:44px;height:44px;border-radius:50%;background:var(--o);display:grid;place-items:center;font:700 18px Sora;flex:none}
.dh b{display:block;font:700 15px Sora;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dh small{color:#ffffffb3}
.dh .x{margin-left:auto;color:#fff}
.dn{flex:1;overflow-y:auto;padding:8px;overscroll-behavior:contain}
.dn button,.dn a{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;font-weight:500;color:var(--c);text-decoration:none;text-align:left}
.dn .on{background:#FF762818;color:var(--o);font-weight:700}
.dn .bd{margin-left:auto;background:var(--o);color:#fff;font:700 11px Inter;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.dn hr{border:0;border-top:1px solid var(--b);margin:8px 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}.top h1{font-size:21px}
.sh2{font-size:15px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh2 a,.sh2 button{font:600 13px Inter;color:var(--o);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border:1px solid var(--b);border-radius:var(--r);padding:12px}.stat small{color:var(--m);display:block}.stat b{font:700 19px Sora;overflow-wrap:anywhere}
.stat.hl{background:var(--o);border-color:var(--o);color:#fff}.stat.hl small{color:#fff;opacity:.85}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.qa button{border:1px solid var(--b);border-radius:var(--r);padding:12px 6px;display:grid;gap:6px;justify-items:center;font-weight:600;font-size:12.5px;text-align:center}
.qa svg{color:var(--o)}
.box{border:1px solid var(--b);border-radius:var(--r);padding:12px;margin-bottom:10px;display:grid;gap:8px;background:var(--bg)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st{background:#FF762822;color:var(--o);font:600 11px Inter;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.ok{background:#e6f6ec;color:#1a7f43}.st.no{background:#fde8e6;color:#b42318}
small,.mut{color:var(--m)}
.prow{display:flex;gap:10px;align-items:center}
.pth{width:60px;height:60px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.pth img{width:100%;height:100%;object-fit:cover}
.pmid{flex:1;display:grid;gap:2px}.pmid b{overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.fld{display:grid;gap:6px;margin-bottom:12px}.fld label{font-weight:600;font-size:13px}
input,textarea,select{font:inherit;font-size:16px;color:var(--c);border:1px solid var(--b);border-radius:10px;padding:11px 12px;background:var(--bg);width:100%;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--o);box-shadow:0 0 0 3px #FF762826}
input[readonly]{background:var(--g);color:var(--c);font-weight:600}
.bst{padding:10px 12px;border-radius:10px;background:var(--g);margin:-4px 0 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bst.ok{background:#e6f6ec;color:#1a7f43}.bst.bad{background:#fde8e6;color:#b42318}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;margin-top:2px;accent-color:var(--o)}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.imgs .im{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--g)}
.imgs img{width:100%;height:100%;object-fit:cover}
.imgs .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;font-size:14px;line-height:1}
.soon{text-align:center;padding:48px 16px;color:var(--m)}.soon b{display:block;font-size:36px;margin-bottom:8px}
.warn{background:#fff4e5;color:#8a4b00;border-radius:var(--r);padding:12px;margin:12px 0}
.warn.bad{background:#fde8e6;color:#9b1c14}
.steps{display:flex;gap:4px;margin:2px 0}.steps i{flex:1;height:4px;border-radius:3px;background:var(--b)}.steps i.on{background:var(--o)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs button{border:1px solid var(--b);border-radius:99px;padding:7px 14px;font-weight:500;white-space:nowrap}.tabs .on{background:var(--o);border-color:var(--o);color:#fff}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;padding:8px 0 0}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .bar{width:100%;max-width:34px;background:var(--o);border-radius:6px 6px 0 0;min-height:2px}
.bars .col span{font-size:10px;color:var(--m);white-space:nowrap}
.bars.dense .col span:not(.sh){visibility:hidden}
.rank{display:flex;align-items:center;gap:10px}.rank i{font:700 13px Sora;color:var(--o);width:18px;font-style:normal}
.meter{height:6px;border-radius:4px;background:var(--b);overflow:hidden}.meter div{height:100%;background:var(--o)}
.stars{color:#f5a300;letter-spacing:1px}
.faq summary{font-weight:600;cursor:pointer;padding:4px 0}.faq p{color:var(--m);margin-top:6px}
.sp{margin-top:10px}
.steps2{display:flex;gap:6px;margin:6px 0 14px}.steps2 i{flex:1;height:4px;border-radius:3px;background:var(--b)}.steps2 i.on{background:var(--o)}
body.chk header,body.chk main{visibility:hidden}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#252525;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}
.sk{background:linear-gradient(90deg,var(--g) 25%,#ececec 37%,var(--g) 63%);background-size:400% 100%;animation:shim 1.3s infinite;border-radius:var(--r);height:84px;margin-bottom:10px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="chk">
<header><div class="wrap hrow">
 <button class="ib" id="mb" aria-label="Open menu" hidden></button>
 <div class="ttl"><b id="hn">Vendor dashboard</b><small id="hs">KAMPZA</small></div>
 <a class="btn ghost sm" id="hb" href="store.html">← Store</a>
</div></header>
<main class="wrap" id="app"><div style="padding-top:16px"><div class="sk"></div><div class="sk"></div></div></main>
<div class="dr" id="dr" aria-hidden="true"><div class="ov" data-close></div><aside id="side" role="dialog" aria-label="Menu"></aside></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL='https://fcgvmxkxwgymgqcbtzjd.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZ3ZteGt4d2d5bWdxY2J0empkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODgyODcsImV4cCI6MjEwODY2NDI4N30.SEROg_J5x2dldpI6buHKYVQbuuyzM4bOJLHPYDWtIbM',AUTH_URL='index.html',STORE_URL='store.html',BUCKET='products',SUPPORT_EMAIL='kampzastore@gmail.com',WHATSAPP='2349059538257';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
const $=s=>document.querySelector(s),fmt=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=t=>new Date(t).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});
const cap=t=>t?t[0].toUpperCase()+t.slice(1):'';
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2800)};
const STEPS=['processing','packed','shipped','delivered'];
const CATS=['Electronics','Fashion','Home & Living','Beauty','Appliances','Groceries','Sports & Outdoors','Books & Stationery','Food & Snacks','Services','Other'];
const IC={menu:'M4 6h16M4 12h16M4 18h16',close:'M6 6l12 12M18 6L6 18',home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',orders:'M9 4h6v3H9zM7 5H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2M8 12h8M8 16h5',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',wallet:'M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h2',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',help:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5M12 17h.01',store:'M4 9l1-5h14l1 5M4 9v11h16V9M4 9a3 3 0 0 0 5.3 1.9A3 3 0 0 0 12 12a3 3 0 0 0 2.7-1.1A3 3 0 0 0 20 9M10 20v-5h4v5',out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',plus:'M12 5v14M5 12h14'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const PAGES={home:['Overview','home'],products:['Products','box'],orders:['Orders','orders'],analytics:['Analytics','chart'],reviews:['Reviews','star'],payouts:['Payouts','wallet'],profile:['Store profile','user'],help:['Help & support','help']};
let UID=null,UPHONE='',V=null,tab='home',BAL={earned:0,paid:0,pending:0,available:0},PR=[],ITEMS=[],ORD={},PAY=[],REV=[],EDIT=null,OF='open',OQ='',PF='all',PQ='',AR=7,BUSY=false,IMGS=[];

/* ---------- Nigerian banks + automatic account-name verification (same service as signup: resolve-account) ---------- */
const FALLBACK_BANKS=['9 Payment Service Bank (9PSB)','Access Bank','Citibank Nigeria','Ecobank Nigeria','Fidelity Bank','First Bank of Nigeria','First City Monument Bank (FCMB)','Globus Bank','Guaranty Trust Bank (GTBank)','Heritage Bank','Jaiz Bank','Keystone Bank','Kuda Microfinance Bank','Lotus Bank','Moniepoint MFB','OPay','PalmPay','Parallex Bank','Polaris Bank','Premium Trust Bank','Providus Bank','Stanbic IBTC Bank','Standard Chartered Bank','Sterling Bank','SunTrust Bank','Taj Bank','Titan Trust Bank','Union Bank of Nigeria','United Bank for Africa (UBA)','Unity Bank','VFD Microfinance Bank','Wema Bank','Zenith Bank'];
let BANKS=FALLBACK_BANKS.slice(),BANKS_OK=false,RES={key:'',name:'',ok:false},VID=0;
const bankOpts=cur=>{const l=BANKS.includes(cur)||!cur?BANKS:[cur,...BANKS];return `<option value="">Select your bank</option>`+l.map(b=>`<option value="${esc(b)}" ${b===cur?'selected':''}>${esc(b)}</option>`).join('')};
async function loadBanks(){
 if(BANKS_OK)return;
 try{
  const{data}=await sb.functions.invoke('resolve-account',{body:{banks:true}});
  if(Array.isArray(data?.banks)&&data.banks.length){BANKS=data.banks;BANKS_OK=true}
 }catch{}
 ['a_b','p_b'].forEach(id=>{const s=$('#'+id);if(s)s.innerHTML=bankOpts(s.value)})}
const bst=(p,m,c='',retry=false)=>{const e=$('#'+p+'_s');if(!e)return;e.className='bst '+c;e.innerHTML=`<span>${esc(m)}</span>${retry?`<button class="btn ghost sm" data-bretry="${p}">Verify again</button>`:''}`};
async function errCode(error,data){if(data&&data.error)return data.error;try{return(await error.context.json()).error||'provider'}catch{return'provider'}}
async function bverify(p){
 const bank=val(p+'_b'),acc=val(p+'_a'),m=$('#'+p+'_m'),id=++VID;
 RES={key:'',name:'',ok:false};if(m)m.value='';
 if(!bank||!/^\d{10}$/.test(acc)){bst(p,acc.length===10&&!bank?'Choose your bank':'Choose your bank and enter your 10-digit account number');return}
 bst(p,'Verifying account…');
 try{
  const{data,error}=await sb.functions.invoke('resolve-account',{body:{bank,account:acc}});
  if(id!==VID)return;
  if(data&&data.account_name){RES={key:bank+'|'+acc,name:data.account_name,ok:true};if(m)m.value=data.account_name;bst(p,'✓ Account verified','ok');return}
  const code=await errCode(error,data);if(id!==VID)return;
  if(code==='not_found')bst(p,'Account not found. Check the bank and account number.','bad');
  else if(code==='bank_unsupported')bst(p,'We cannot verify this bank. Please choose another bank.','bad');
  else if(code==='bad_request')bst(p,'Enter a valid 10-digit account number.','bad');
  else bst(p,'Could not verify right now. Please try again.','bad',true)
 }catch{if(id===VID)bst(p,'Could not verify right now. Please try again.','bad',true)}}
const sameAcc=(bank,acc)=>RES.ok&&RES.key===bank+'|'+acc;
function initProf(){
 if(V.payout_verified&&V.account_name&&V.bank_name&&V.account_number){RES={key:V.bank_name+'|'+V.account_number,name:V.account_name,ok:true};bst('p','✓ Account verified','ok')}
 else if(V.bank_name&&/^\d{10}$/.test(V.account_number||''))bverify('p');
 else bst('p','Choose your bank and enter your 10-digit account number')}

/* ---------- menu ---------- */
$('#mb').innerHTML=ic('menu');
const openMenu=()=>{document.body.classList.add('menu');$('#dr').setAttribute('aria-hidden','false')};
const closeMenu=()=>{document.body.classList.remove('menu');$('#dr').setAttribute('aria-hidden','true')};
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function side(){
 const n=openItems().length;
 $('#side').innerHTML=`<div class="dh"><span class="av">${esc((V.business_name[0]||'K').toUpperCase())}</span><span style="min-width:0"><b>${esc(V.business_name)}</b><small>Approved vendor</small></span><button class="x" data-close aria-label="Close menu">${ic('close')}</button></div>
<div class="dn">${Object.entries(PAGES).filter(([k])=>k!=='help').map(([k,[t,i]])=>`<button data-t="${k}" class="${k===tab?'on':''}">${ic(i)}${t}${k==='orders'&&n?`<span class="bd">${n>99?'99+':n}</span>`:''}</button>`).join('')}<hr>
<button data-t="help" class="${tab==='help'?'on':''}">${ic('help')}Help &amp; support</button>
<a href="${STORE_URL}">${ic('store')}Back to store</a>
<button data-logout>${ic('out')}Log out</button></div>`}

/* ---------- boot ---------- */
async function session(){for(let i=0;i<3;i++){try{const{data}=await sb.auth.getSession();if(data.session)return data.session}catch{}await new Promise(r=>setTimeout(r,400))}return null}
const loadVendor=async()=>{const{data}=await sb.from('vendors').select('*').eq('user_id',UID).maybeSingle();return data};
async function boot(){
 const ses=await session();
 if(!ses){location.replace(AUTH_URL);return}
 UID=ses.user.id;const md=ses.user.user_metadata||{};UPHONE=ses.user.phone||md.phone||'';
 loadBanks();
 let v=await loadVendor();
 if(!v&&md.vendor_application){
  const{error}=await sb.rpc('register_vendor');
  if(error){gate('Could not finish your application',error.message,'bad');return}
  v=await loadVendor()}
 V=v;
 if(!v){applyForm();return}
 enter()}
function enter(){
 $('#hn').textContent=V.business_name;$('#hs').textContent=cap(V.status)+' vendor';
 if(V.status==='pending'){gate('Application under review','Thanks for applying, '+V.business_name+'. An admin is reviewing your application. Your dashboard unlocks automatically once it is approved.','wait');return}
 if(V.status==='rejected'){gate('Application not approved','Your vendor application was not approved. You can update your details and apply again, or contact KAMPZA support.','bad',`<button class="btn" data-reapply>Update &amp; reapply</button> `);return}
 if(V.status==='suspended'){gate('Account suspended','Your vendor account is suspended. Contact KAMPZA support to resolve this.','bad');return}
 document.body.classList.remove('chk');$('#mb').hidden=false;$('#hb').hidden=true;draw();refresh();
 if(!window._poll)window._poll=setInterval(()=>{if(!document.hidden&&!EDIT&&V?.status==='approved')refresh()},60000)}
function gate(t,m,kind,extra=''){
 document.body.classList.remove('chk');$('#mb').hidden=true;$('#hb').hidden=false;$('#hn').textContent=V?V.business_name:'Vendor dashboard';
 $('#app').innerHTML=`<div class="soon"><b>${kind==='bad'?'⛔':kind==='wait'?'⏳':'ℹ️'}</b><h2 style="color:var(--c)">${esc(t)}</h2><p style="margin:8px 0 16px">${esc(m)}</p>${extra}${kind==='wait'?`<button class="btn ghost" data-check>Check status</button> `:''}<a class="btn ghost" href="${STORE_URL}">Back to store</a></div>`;scrollTo(0,0)}

/* ---------- vendor application ---------- */
function applyForm(p={}){
 document.body.classList.remove('chk');$('#mb').hidden=true;$('#hb').hidden=false;$('#hn').textContent='Become a vendor';$('#hs').textContent='Apply to sell on KAMPZA';
 RES={key:'',name:'',ok:false};
 $('#app').innerHTML=`<div class="top"><h1>Vendor application</h1></div>
<p class="mut" style="margin-bottom:14px">Tell us about your business. An admin reviews every application, and your dashboard opens as soon as you are approved.</p>
<div class="fld"><label for="a_n">Business / store name</label><input id="a_n" maxlength="60" value="${esc(p.business_name||'')}" placeholder="e.g. Ada's Gadgets"></div>
<div class="fld"><label for="a_c">What do you sell?</label><select id="a_c">${CATS.map(c=>`<option ${p.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>

async function refresh(){
 try{
  const vs=await loadVendor();
  if(!vs||vs.status!=='approved'){V=vs;vs?enter():applyForm();return}
  V=vs;
  const[p,i,pay,b]=await Promise.all([
   sb.from('products').select('*').eq('vendor_id',UID).order('created_at',{ascending:false}),
   sb.from('order_items').select('*').eq('vendor_id',UID).order('id',{ascending:false}).limit(300),
   sb.from('payouts').select('*').eq('vendor_id',UID).order('created_at',{ascending:false}).limit(50),
   sb.rpc('vendor_balance')]);
  if(!p.error)PR=p.data;if(!i.error)ITEMS=i.data;if(!pay.error)PAY=pay.data;if(!b.error&&b.data)BAL=b.data;
  const ids=[...new Set(ITEMS.map(x=>x.order_id))];
  if(ids.length){let r=await sb.from('orders').select('id,code,pay_method,paid,phone,address,created_at,status,pay_claimed_at').in('id',ids);if(r.error)r=await sb.from('orders').select('id,code,pay_method,paid,phone,address,created_at,status').in('id',ids);if(r.data)ORD=Object.fromEntries(r.data.map(o=>[o.id,o]))}
  if(PR.length){const{data}=await sb.from('reviews').select('*').in('product_id',PR.map(x=>x.id)).order('created_at',{ascending:false}).limit(100);if(data)REV=data}
  side();if(!EDIT&&!document.activeElement?.matches('input,textarea,select'))view()
 }catch(e){console.error(e);toast('Could not refresh. Check your connection.')}}

function series(n){
 const out=[],now=new Date();now.setHours(0,0,0,0);
 for(let k=n-1;k>=0;k--){const d=new Date(now);d.setDate(d.getDate()-k);out.push({key:d.toDateString(),l:n>10?(d.getDate()%5===0||k===0?d.getDate()+'/'+(d.getMonth()+1):''):d.toLocaleDateString('en-NG',{weekday:'short'}),v:0})}
 const m=Object.fromEntries(out.map(x=>[x.key,x]));
 ITEMS.forEach(i=>{if(i.status==='cancelled')return;const o=ORD[i.order_id];if(!o)return;const k=new Date(o.created_at).toDateString();if(m[k])m[k].v+=money(i)});
 return out}

async function upload(files){
 const room=5-IMGS.length;if(room<=0){toast('Maximum 5 photos');return}
 const list=[...files].slice(0,room);toast('Uploading…');
 for(const f of list){
  if(f.size>5*1024*1024){toast('Each photo must be under 5 MB');continue}
  const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
  const path=UID+'/'+Date.now()+Math.random().toString(36).slice(2,7)+'.'+ext;
  const{error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});
  if(error){toast('Upload failed: '+error.message);continue}
  IMGS.push(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl)}
 const el=$('#imgs');if(el)el.innerHTML=imgHtml()}

document.addEventListener('input',e=>{
 if(e.target.id==='pq'){PQ=e.target.value;fillP()}
 if(e.target.id==='oq'){OQ=e.target.value;fillO()}
 if(e.target.id==='a_a'||e.target.id==='p_a'){
  const d=e.target.value.replace(/\D/g,'').slice(0,10);if(d!==e.target.value)e.target.value=d;
  bverify(e.target.id[0])}});
const val=id=>($('#'+id)?.value||'').trim();
document.addEventListener('click',async e=>{
 let x;
 if(g(e,'#mb')){openMenu();return}
 if(g(e,'[data-close]')){closeMenu();return}
 if(g(e,'[data-logout]')){closeMenu();await sb.auth.signOut();location.replace(AUTH_URL);return}
 if(x=g(e,'[data-t]')){tab=x.dataset.t;EDIT=null;closeMenu();draw();return}
 if(x=g(e,'[data-of]')){OF=x.dataset.of;view();return}
 if(x=g(e,'[data-pf]')){PF=x.dataset.pf;view();return}
 if(x=g(e,'[data-ar]')){AR=+x.dataset.ar;view();return}
 if(x=g(e,'[data-bretry]')){bverify(x.dataset.bretry);return}
 if(g(e,'[data-check]')){await refresh();if(V?.status==='pending')toast('Still under review');return}
 if(g(e,'[data-reapply]')){applyForm(V||{});return}
 if(g(e,'[data-new]')){tab='products';EDIT='new';IMGS=[];draw();return}
 if(x=g(e,'[data-edit]')){EDIT=x.dataset.edit;IMGS=[...(PR.find(p=>p.id===EDIT)?.images||[])];view();scrollTo(0,0);return}
 if(g(e,'[data-cancelform]')){EDIT=null;view();return}
 if(x=g(e,'[data-rmimg]')){IMGS.splice(+x.dataset.rmimg,1);$('#imgs').innerHTML=imgHtml();return}
 if(x=g(e,'[data-tog]')){
  const p=PR.find(k=>k.id===x.dataset.tog);if(!p)return;
  const{error}=await sb.from('products').update({active:!p.active}).eq('id',p.id).eq('vendor_id',UID);
  if(error){toast(error.message);return}toast(p.active?'Hidden from store':'Now visible in store');await refresh();return}
 if(x=g(e,'[data-stk]')){
  const p=PR.find(k=>k.id===x.dataset.stk);if(!p)return;
  const a=prompt('New stock for "'+p.name+'"',p.stock);if(a===null)return;
  const n=Math.floor(Number(a));if(!(n>=0)){toast('Enter a valid number');return}
  const{error}=await sb.from('products').update({stock:n}).eq('id',p.id).eq('vendor_id',UID);
  if(error){toast(error.message);return}toast('Stock updated');await refresh();return}
 if(x=g(e,'[data-dup]')){
  const p=PR.find(k=>k.id===x.dataset.dup);if(!p)return;
  const{id,created_at,...rest}=p;
  const{error}=await sb.from('products').insert({...rest,name:(p.name+' (copy)').slice(0,100),active:false,vendor_id:UID});
  if(error){toast(error.message);return}toast('Duplicated as a hidden product');await refresh();return}
 if(x=g(e,'[data-del]')){
  const p=PR.find(k=>k.id===x.dataset.del);if(!p)return;
  if(!confirm('Delete "'+p.name+'" permanently?'))return;
  const{error}=await sb.from('products').delete().eq('id',p.id).eq('vendor_id',UID);
  if(error){toast('This product has orders, so hide it instead.');return}toast('Product deleted');await refresh();return}
const setItem=async(x,id,st,okMsg)=>{x.disabled=true;const{error}=await sb.rpc('vendor_set_item',{p_item:id,p_status:st});if(error){toast(error.message);x.disabled=false;return false}toast(okMsg);await refresh();return true};
 if(x=g(e,'[data-accept]')){
  const[id,oid]=x.dataset.accept.split('|'),needPay=blocked({order_id:oid});
  if(!confirm(needPay?'Accept this order and confirm that you received the buyer’s payment?':'Accept this order?'))return;
  x.disabled=true;
  if(needPay){const{error}=await sb.rpc('vendor_approve_payment',{p_order:String(oid)});if(error){toast(error.message);x.disabled=false;return}}
  await setItem(x,id,'packed','Order accepted'+(needPay?'. The buyer’s receipt is ready':''));return}
 if(x=g(e,'[data-reject]')){if(!confirm('Reject this order? The buyer will be refunded if they paid and your stock is restored.'))return;await setItem(x,x.dataset.reject,'cancelled','Order rejected');return}
 if(x=g(e,'[data-cancelit]')){if(!confirm('Cancel this order? The buyer will be refunded if they paid.'))return;await setItem(x,x.dataset.cancelit,'cancelled','Order cancelled');return}
 if(x=g(e,'[data-step]')){
  const[id,st]=x.dataset.step.split('|');
  if(st==='cancelled'&&!confirm('Cancel this item? The buyer will be refunded if they paid.'))return;
  x.disabled=true;
  const{error}=await sb.rpc('vendor_set_item',{p_item:id,p_status:st});
  if(error){toast(error.message);x.disabled=false;return}
  toast(st==='cancelled'?'Item cancelled':'Updated to '+cap(st));await refresh();return}
 if(g(e,'[data-all]')){const w=$('#w_a');if(w)w.value=BAL.available;return}
 if(x=g(e,'[data-withdraw]')){
  const n=Math.floor(Number(val('w_a')));
  if(!(n>=1000)){toast('Minimum withdrawal is ₦1,000');return}
  if(n>BAL.available){toast('That is more than your available balance');return}
  if(!confirm('Withdraw '+fmt(n)+' to '+(V.bank_name||'your bank')+' •••• '+(V.account_number||'').slice(-4)+'?'))return;
  x.disabled=true;
  const{error}=await sb.rpc('request_payout',{p_amount:n});
  if(error){toast(error.message);x.disabled=false;return}
  toast('Withdrawal requested');await refresh();return}
 if(x=g(e,'[data-saveprof]')){
  if(BUSY)return;
  const a={p_business_name:val('p_n'),p_category:val('p_c'),p_location:val('p_l'),p_description:val('p_d'),p_phone:val('p_p'),p_bank_name:val('p_b'),p_account_number:val('p_a'),p_account_name:val('p_m')};
  if(a.p_business_name.length<2){toast('Enter your business name');return}
  if(a.p_location.length<3){toast('Enter your location');return}
  if(a.p_bank_name.length<2){toast('Choose your bank');return}
  if(!/^\d{10}$/.test(a.p_account_number)){toast('Account number must be 10 digits');return}
  if(!sameAcc(a.p_bank_name,a.p_account_number)){toast('Your account must be verified first. Check the bank and account number.');return}
  a.p_account_name=RES.name;
  BUSY=true;x.disabled=true;x.textContent='Saving…';
  const{error}=await sb.rpc('vendor_update_profile',a);
  if(!error){try{await sb.functions.invoke('resolve-account',{body:{save:true}})}catch{}}
  BUSY=false;x.disabled=false;x.textContent='Save changes';
  if(error){toast(error.message);return}
  V=await loadVendor()||V;toast('Profile updated');draw();return}
 if(x=g(e,'[data-apply]')){
  if(BUSY)return;
  const a={p_business_name:val('a_n'),p_category:val('a_c'),p_location:val('a_l'),p_description:val('a_d'),p_phone:val('a_p'),p_bank_name:val('a_b'),p_account_number:val('a_a'),p_account_name:val('a_m')};
  if(a.p_business_name.length<2){toast('Enter your business name');return}
  if(a.p_location.length<3){toast('Enter your location');return}
  if(a.p_phone.replace(/\D/g,'').length<10){toast('Enter a valid phone number');return}
  if(a.p_bank_name.length<2){toast('Choose your bank');return}
  if(!/^\d{10}$/.test(a.p_account_number)){toast('Account number must be 10 digits');return}
  if(!sameAcc(a.p_bank_name,a.p_account_number)){toast('Verify your account first. Your account name must appear.');return}
  if(!$('#a_t').checked){toast('Please accept the vendor terms');return}
  a.p_account_name=RES.name;
  BUSY=true;x.disabled=true;x.textContent='Submitting…';
  const{error}=await sb.rpc('apply_vendor',a);BUSY=false;
  if(error){toast(error.message);x.disabled=false;x.textContent='Submit application';return}
  try{await sb.functions.invoke('resolve-account',{body:{save:true}})}catch{}
  V=await loadVendor();toast('Application submitted');V?enter():boot();return}
 if(x=g(e,'[data-saveprod]')){
  if(BUSY)return;
  const name=val('f_n'),price=Math.floor(Number(val('f_p'))),old=Math.floor(Number(val('f_o')))||null,stock=Math.floor(Number(val('f_s')));
  if(name.length<2){toast('Enter a product name');return}
  if(!(price>0)){toast('Enter a valid price');return}
  if(!(stock>=0)){toast('Enter the stock quantity');return}
  if(old&&old<=price){toast('Old price must be higher than the price');return}
  const specs={};val('f_sp').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0){const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(k&&v)specs[k]=v}});
  const row={name,price,old_price:old,stock,emoji:val('f_e')||null,category:val('f_c'),brand:val('f_b')||null,description:val('f_d')||null,specs,images:IMGS,active:$('#f_a').checked};
  BUSY=true;x.disabled=true;x.textContent='Saving…';
  const q=EDIT==='new'?sb.from('products').insert({...row,vendor_id:UID}):sb.from('products').update(row).eq('id',EDIT).eq('vendor_id',UID);
  const{error}=await q;BUSY=false;
  if(error){toast(error.message);x.disabled=false;x.textContent='Save product';return}
  toast('Product saved');EDIT=null;await refresh();draw();return}
});
boot();
</script>
</body>
</html>
