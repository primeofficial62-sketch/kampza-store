<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAMPZA</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FF7628">
<style>html,body{margin:0;height:100%;background:#fff}</style>
<script>
/* No welcome slides: signed-in users go straight to the store, everyone else to the login page. */
(function(){
  var signed = false;
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(/^sb-.+-auth-token$/.test(k)){
        var v = JSON.parse(localStorage.getItem(k) || 'null');
        if(v && (v.refresh_token || v.access_token || v.currentSession)){ signed = true; break; }
      }
    }
  }catch(e){}
  location.replace(signed ? 'store.html' : 'auth.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=auth.html"></noscript>
</head>
<body></body>
</html>
