.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g);white-space:nowrap}
.pill.ok{background:#e3f6ea;color:var(--ok)}.pill.warn{background:#fff1dc;color:var(--warn)}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.info{background:#e6effa;color:var(--info)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 12px}h2{font-size:18px;margin:2px 0 12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:90vw}#toast.show{opacity:1}
.lock{position:fixed;inset:0;background:var(--c);color:#fff;display:grid;place-items:center;padding:24px;z-index:100;overflow-y:auto}.lock[hidden]{display:none}

 if(e.target.value==='Cancelled'&&!confirm('Cancel this order? Wallet payments are refunded and stock is returned.'))return show();
 await run(sb.from('orders').update({status:e.target.value}).eq('id',id),'Order updated');show();
});
$('#burger').onclick=()=>document.body.classList.toggle('open');$('#scrim').onclick=()=>document.body.classList.remove('open');
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;q='';$('#gs').value='';return show()}
 if(b.dataset.of){ofilter=b.dataset.of;return show()}
 const act=b.dataset.act,card=b.closest('.card')||b.closest('tr');if(!act)return;b.disabled=true;
 try{
  if(act==='audit-export'){const rows=app._audit||[];csv('kampza-admin-audit.csv',[['Created','Admin','Action','Details'],...rows.map(x=>[x.created_at,x.admin_id||x.actor_id,x.action||x.event,JSON.stringify(x.details||x.metadata||{})])]);}
  else if(act==='demo-preview'){const out=$('#demo-result');out.textContent='Checking secure demo-data preview function…';const {data,error}=await sb.rpc('admin_preview_demo_data');if(error){out.textContent='Not ready: '+error.message+'. No data was changed. Install the verified demo-data database functions after schema review.'}else{out.textContent=JSON.stringify(data,null,2)}}
  else if(act==='demo-clear'){const out=$('#demo-result');const preview=await sb.rpc('admin_preview_demo_data');if(preview.error){out.textContent='Cannot clear data: secure preview function is not installed. No data was changed.';return}const summary=JSON.stringify(preview.data);if(!confirm('You are about to delete ONLY records marked as demo/test. Preview: '+summary+' Continue?'))return;const phrase=prompt('Type CLEAR DEMO DATA to confirm');if(phrase!=='CLEAR DEMO DATA')return toast('Confirmation did not match');out.textContent='Requesting secure deletion…';const {data,error}=await sb.rpc('admin_clear_demo_data',{p_confirmation:'CLEAR DEMO DATA'});if(error){out.textContent='Deletion was not completed: '+error.message}else{out.textContent='Server response: '+JSON.stringify(data);toast('Demo data cleanup request completed')}}
  else if(act==='qsave')await run(sb.from('quotes').update({status:val(card,'status').value,reply_price:num(val(card,'price').value),reply_note:val(card,'note').value.trim()||null}).eq('id',card.dataset.id),'Reply saved');
  else if(act==='psave'||act==='padd'||act==='pdup'){
   const g=k=>val(card,k),name=g('name').value.trim(),price=g('price').value;if(!name||price==='')return toast('Name and price are required');
   const row={name,price:Number(price),old_price:num(g('old_price').value),stock:num(g('stock').value),category:g('category').value.trim()||null,brand:g('brand').value.trim()||null,emoji:g('emoji').value.trim()||null,image:g('image').value.trim()||null,description:g('description').value.trim()||null};
   if(act==='psave'){Object.assign(row,{active:g('active').checked,flash:g('flash').checked});await run(sb.from('products').update(row).eq('id',card.dataset.id),'Product saved')}
   else if(act==='pdup'){const {error}=await run(sb.from('products').insert({id:card.dataset.id+'-copy'+Date.now().toString(36).slice(-3),...row,name:name+' (copy)',active:false}),'Duplicated (hidden until you enable it)');if(!error)show()}
   else{const id=g('id').value.trim();if(!id)return toast('Give the product an ID');const {error}=await run(sb.from('products').insert({id,...row}),'Product added');if(!error)show()}
  }else if(act==='pdel'){if(!confirm('Delete this product for good? To hide it instead, untick "Visible in store".'))return;const {error}=await run(sb.from('products').delete().eq('id',card.dataset.id),'Product deleted');if(!error)show()}
  else if(act==='ssave'){const v=num(val(card,'stock').value);if(v==null||v<0)return toast('Enter a valid stock number');const {error}=await run(sb.from('products').update({stock:v}).eq('id',card.dataset.id),'Stock updated');if(!error)show()}
  else if(act==='wadj'){const amt=Number(prompt('Amount in ₦ (use a minus to deduct, e.g. -500)',''));if(!amt)return;const note=prompt('Reason (shown in their wallet history)','')||'';const {error}=await run(sb.rpc('admin_adjust_wallet',{p_user:card.dataset.id,p_amount:amt,p_note:note}),'Wallet updated');if(!error){users=[];show()}}
  else if(act==='oexp')csv('kampza-orders.csv',[['Order','Customer','Phone','Items','Total','Payment','Status','Date'],...(app._o||[]).map(o=>[o.id,uname(o.user_id),o.phone,summ(o),o.total,o.pay,o.status,o.created_at])]);
  else if(act==='cexp')csv('kampza-customers.csv',[['Name','Email','Wallet','Joined'],...users.map(u=>[u.name,u.email,u.balance,u.joined])]);
  else if(act==='inv'){const {data:o}=await sb.from('orders').select('*').eq('id',card.dataset.id).single();const w=window.open('','_blank');if(w){w.document.write(`<title>Invoice ${esc(o.id)}</title><body style="font:14px Inter,sans-serif;max-width:640px;margin:30px auto"><img src="${LOGO}" width="56" style="border-radius:12px"><h2>KAMPZA — Invoice ${esc(o.id)}</h2><p>${esc(uname(o.user_id))} · ${esc(o.phone)}<br>${esc(o.address)}<br>${when(o.created_at)}</p><table width="100%" cellpadding="6" border="1" style="border-collapse:collapse">${(o.items||[]).map(i=>`<tr><td>${esc(i.n)}</td><td>${esc(i.q)}</td><td>${naira(i.p*i.q)}</td></tr>`).join('')}<tr><td colspan="2"><b>Total</b></td><td><b>${naira(o.total)}</b></td></tr></table><p>Payment: ${o.pay==='wallet'?'Paid with wallet':'Pay on delivery'} · Status: ${esc(o.status)}</p><script>onload=()=>print()<\/script>`);w.document.close()}}
  else if(act==='mtest'||act==='mall'){const subject=$('#m-sub').value.trim(),message=$('#m-msg').value.trim();if(subject.length<3||message.length<5)return toast('Add a subject and a message');if(act==='mall'&&!confirm('Send this to ALL customers now? This cannot be undone.'))return;
   const {data,error}=await sb.functions.invoke('admin-broadcast',{body:{token:session.access_token,subject,message,test:act==='mtest'}});toast(error||!data?.ok?(data?.error||error?.message||'Could not send'):`Sent to ${data.sent} of ${data.total}`)}
 }finally{b.disabled=false}
});
async function signOut(){await sb.auth.signOut();location.reload()}$('#out').onclick=signOut;
let pin='',busy=false;const lsub=$('#lsub'),dots=$('#dots');
const paint=()=>dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<pin.length));
const msg=(t,bad)=>{lsub.textContent=t;lsub.classList.toggle('err',!!bad)};
function unlock(){document.body.classList.remove('locked');$('#lock').hidden=true;show()}
async function tryPin(){
 busy=true;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=true);msg('Checking…');let r=null,fail=false;
 try{const {data,error}=await sb.functions.invoke('admin-pin-login',{body:{pin}});r=data;if(error&&!data)fail=true;
  if(r?.ok){let v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'email'});if(v.error)v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'magiclink'});
   if(v.error||!v.data?.session)fail=true;else{session=v.data.session;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}fail=true}}
 }catch(e){fail=true}
 busy=false;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=false);pin='';paint();dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');
 if(fail||!r)msg('Could not log in. Check your connection and try again.',true);else if(r.locked)msg('Too many wrong tries. Wait '+Math.ceil(r.seconds/60)+' min.',true);else msg('Wrong PIN. '+r.left+' '+(r.left===1?'try':'tries')+' left.',true);
}
function press(d){if(busy||pin.length>=4)return;pin+=d;paint();if(pin.length===4)tryPin()}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='pback')return;press(b.textContent.trim())});
$('#pback').onclick=()=>{if(!busy){pin=pin.slice(0,-1);paint()}};
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace'&&!busy){pin=pin.slice(0,-1);paint()}});
(async()=>{const {data:{session:cur}}=await sb.auth.getSession();if(cur){session=cur;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}await sb.auth.signOut()}})();
</script></body></html>
