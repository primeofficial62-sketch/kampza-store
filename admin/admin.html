*{box-sizing:border-box;margin:0}

h1,h2,h3,.sora{font-family:Sora,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.logo{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g);white-space:nowrap}
.pill.ok{background:#e3f6ea;color:var(--ok)}.pill.warn{background:#fff1dc;color:var(--warn)}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.info{background:#e6effa;color:var(--info)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut)}

.hb{height:8px;background:var(--g);border-radius:9px;overflow:hidden;margin:3px 0 9px}.hb i{display:block;height:100%;background:var(--o)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:90vw}#toast.show{opacity:1}
.lock{position:fixed;inset:0;background:var(--c);color:#fff;display:grid;place-items:center;padding:24px;z-index:100;overflow-y:auto}.lock[hidden]{display:none}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:320px}.lock .logo{width:84px;height:84px;border-radius:20px;margin-bottom:10px}

.dots{display:flex;gap:16px;margin:22px 0}.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}.dot.on{background:var(--o);border-color:var(--o)}.dots.shake{animation:shake .35s}

}

 const [o,p,po,qu,wt]=R,T=/test|demo|sample|dummy/i,tp=p.data.filter(x=>T.test(x.name)),tv=VEND.filter(v=>T.test(v.business_name)),ta=users.filter(u=>/@kampza\.test$|\btest\b|demo/i.test(u.email||''));

 app.innerHTML=`<div class="card"><div class="row sp"><div><h2 style="margin:0 0 6px">Demo data centre</h2><div class="mut">Every action here deletes real rows and cannot be undone. Download a backup first. Each delete asks you to type a confirmation word.</div></div><button class="btn alt" data-act="dbackup">Download backup (JSON)</button></div>
 <div class="row" style="margin-top:10px">${pill(o.data.length+' orders','warn')}${pill(p.data.length+' products','warn')}${pill(VEND.length+' vendors','warn')}${pill(ta.length+' test accounts','info')}${owner?'':pill('Owner role needed to delete','bad')}</div></div>
 <div class="card"><b>Orders</b><div class="mut" style="margin:4px 0 8px">${o.data.length} orders (${o.data.filter(x=>x.paid).length} paid, ${paidOpen} paid and still open). Deleting removes all orders, their items and their status history. Stock is not restored.</div>
 <label class="row" style="margin-bottom:8px"><input type="checkbox" id="d-force" style="width:auto;min-height:0"> <span class="mut">Also delete paid orders that are still open (refund customers first)</span></label>
 <button class="btn red" data-act="dorders"${lock}>Delete all orders</button></div>
 <div class="card"><div class="row sp"><b>Products</b><span class="row"><button class="btn alt sm" data-act="dsel" data-m="test">Select test items (${tp.length})</button><button class="btn alt sm" data-act="dsel" data-m="all">Select all</button><button class="btn alt sm" data-act="dsel" data-m="none">Clear</button></span></div>
 <div class="mut" style="margin:4px 0 8px">Products that appear on past orders can only be deleted after the orders are deleted.</div>
 <div class="tw" style="max-height:340px;overflow:auto">${tbl(['','Product','Category','Stock','Owner'],p.data.map(x=>`<tr><td><input type="checkbox" class="dchk" value="${esc(x.id)}" data-t="${T.test(x.name)?1:0}" style="width:auto;min-height:0"></td><td>${esc(x.name)} ${T.test(x.name)?pill('Test','warn'):''}</td><td>${esc(x.category||'—')}</td><td>${x.stock}</td><td>${esc(vname(x.vendor_id))}</td></tr>`)).replace('class="card tw"','class="tw"')}</div>
 <button class="btn red" data-act="dprods" style="margin-top:10px"${lock}>Delete selected products</button></div>
 <div class="card"><b>Vendors</b>${VEND.length?VEND.map(v=>`<div class="item" data-id="${esc(v.id)}"><span>${esc(v.business_name)} ${T.test(v.business_name)?pill('Test','warn'):''} ${pill(v.status)}</span><button class="btn red sm" data-act="dvend"${lock}>Delete vendor</button></div>`).join(''):'<div class="empty">No vendors.</div>'}</div>
 <div class="card"><b>Accounts, wallets and other records</b>
 ${ta.length?ta.map(u=>`<div class="item"><span>${esc(u.email)} <span class="mut">${esc(u.name||'')}</span></span><span>${naira(u.balance)}</span></div>`).join(''):'<div class="empty">No test accounts found.</div>'}
 <p class="mut" style="margin-top:10px">Wallet entries: ${wt.count} · Payout requests: ${po.count} · Quote requests: ${qu.count}. Accounts can’t be deleted from the browser. Delete them in Supabase under Authentication → Users. Wallet entries and payout requests have no delete function yet, so they stay until a reviewed database change adds one.</p></div>`;
}
};

Object.assign(TITLES,{vendors:'Vendor management',finance:'Finance & payouts',wallets:'Wallet management',promotions:'Promotions',content:'Store content',staff:'Staff & permissions',security:'Security centre',activity:'Activity & audit',settings:'Marketplace settings',demo:'Demo data centre'});

const moduleIntro=(title,desc,items)=>`<div class="card"><div class="row sp"><div><div class="mut" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase">KAMPZA CONTROL CENTRE</div><h2 style="font-size:20px;margin:7px 0">${title}</h2><div class="mut">${desc}</div></div><span class="pill info">Integration stage</span></div></div><div class="grid">${items.map(x=>`<div class="card"><div style="font-size:20px;margin-bottom:10px">${x[0]}</div><b>${x[1]}</b><p class="mut" style="margin-top:7px">${x[2]}</p></div>`).join('')}</div>`;
const pendingNote=`<div class="card"><b>Not connected yet</b><p class="mut" style="margin-top:7px">The database tables for this section don’t exist yet. It needs a reviewed migration before it can store anything, so nothing here is wired up.</p></div>`;

views.content=async()=>{app.innerHTML=moduleIntro('Store content','Manage the public-facing marketplace experience.',[['▧','Homepage banners','Create and schedule hero banners and promotional tiles.'],['▤','Categories','Organise marketplace categories and display order.'],['✎','Pages & policies','Edit About, FAQ, Terms, Privacy and vendor policies.'],['⌕','SEO','Manage page titles, descriptions and social previews.']])+pendingNote};
views.staff=async()=>{app.innerHTML=moduleIntro('Staff & permissions','Manage authorised people who operate KAMPZA.',[['♙','Staff accounts','Invite, activate and deactivate admin staff.'],['⬡','Role-based access','Configure Super Admin, Operations, Finance, Support and Marketing permissions.'],['◷','Staff activity','Review sensitive actions by staff member.']])+`<div class="card"><b>Security rule</b><p class="mut" style="margin-top:7px">Do not grant roles from client-side code. Role changes must be authorised and enforced by Supabase RLS or trusted server functions. Only Super Admin should manage privileged roles.</p></div>`+pendingNote};
views.security=async()=>{app.innerHTML=moduleIntro('Security centre','Review access, sessions and sensitive account activity.',[['⬡','Authentication','Preserve the existing PIN-to-Supabase authentication flow.'],['◷','Login history','Review successful and failed admin sign-ins.'],['▣','Active sessions','Inspect and revoke sessions where supported.'],['⚑','Sensitive actions','Require confirmation and server-side authorisation.']])+pendingNote};

const applyTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀':'☾';document.querySelector('meta[name=theme-color]')?.setAttribute('content',t==='dark'?'#131416':'#202124')};
$('#theme').onclick=async()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);const {error}=await sb.auth.updateUser({data:{admin_theme:t}});toast(error?'Theme changed here, but could not be saved: '+error.message:(t==='dark'?'Dark':'Light')+' mode saved to your account')};
async function show(){
 $('#title').textContent=TITLES[tab];document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.body.classList.remove('open');app.innerHTML=sk;
 try{await views[tab]()}catch(e){app.innerHTML=err('this page',e)}
}
const val=(c,k)=>c.querySelector(`[data-f=${k}]`),num=v=>v===''||v==null?null:Number(v);
const SEARCHABLE=['orders','products','stock','people','vendors','activity'];
let t1;document.addEventListener('input',e=>{
 if(e.target.id==='q'||e.target.id==='gs'){const g=e.target.id==='gs';q=e.target.value;clearTimeout(t1);t1=setTimeout(async()=>{if(g&&!SEARCHABLE.includes(tab)){tab='orders';await show()}else await views[tab]();const el=$('#q');if(el&&!g){el.focus();el.setSelectionRange(q.length,q.length)}},300)}});
document.addEventListener('change',e=>{if(e.target.id==='rng'){range=e.target.value;show()}else if(e.target.id==='vf'){vf=e.target.value;show()}});
$('#burger').onclick=()=>document.body.classList.toggle('open');$('#scrim').onclick=()=>document.body.classList.remove('open');
const friendly=m=>/FORBIDDEN|Not allowed/i.test(m)?'Your admin role isn’t allowed to do this.':m;
// Runs a write. rows=true means a table write that must return at least one row (otherwise row security blocked it silently).
const done=async(p,ok,log,rows)=>{const r=await p;if(r.error){toast(friendly(r.error.message));return false}if(rows&&!(r.data&&r.data.length)){toast('Not saved. Your admin role may not be allowed to change this.');return false}toast(ok);if(log)audit(...log);return true};
const dl=(name,type,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()};const typed=(msg,word)=>new Promise(res=>{
 const o=document.createElement('div');
 o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:300';
 o.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><h2>Are you sure?</h2><p class="mut" style="margin-bottom:10px">${esc(msg)}</p><p style="margin-bottom:8px">Type <b>${esc(word)}</b> to confirm</p><input id="tc" autocomplete="off" autocapitalize="characters"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn alt" id="tn">Cancel</button><button class="btn red" id="ty" disabled>Confirm</button></div></div>`;
 document.body.appendChild(o);
 const i=o.querySelector('#tc'),y=o.querySelector('#ty'),close=v=>{o.remove();if(!v)toast('Cancelled. Nothing was deleted.');res(v)};
 i.oninput=()=>{y.disabled=i.value.trim().toUpperCase()!==word};
 y.onclick=()=>close(true);
 o.querySelector('#tn').onclick=()=>close(false);
 i.focus();
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;q='';$('#gs').value='';return show()}
 if(b.dataset.of){ofilter=b.dataset.of;return show()}
 const act=b.dataset.act;if(!act)return;const row=b.closest('[data-id]');b.disabled=true;
 try{
  if(act==='audit-export')csv('kampza-admin-audit.csv',[['When','Role','Action','Target','Details'],...(app._audit||[]).map(x=>[x.at,x.actor_role,x.action,(x.target_table||'')+' '+(x.target_id||''),JSON.stringify(x.details||{})])]);
  else if(act==='qsave'){const p=val(row,'price').value,r={status:val(row,'status').value,reply_price:p===''?null:Number(p),reply_note:val(row,'note').value.trim()||null};await done(sb.from('quotes').update(r).eq('id',row.dataset.id).select('id'),'Reply saved',['quote_reply','quotes',row.dataset.id,r],true)}
  else if(act==='psave'){const s=num(val(row,'stock').value),pr=val(row,'price'),r={stock:s};if(!Number.isInteger(s)||s<0)return toast('Stock must be a whole number, 0 or more');
   if(pr){const n=Number(pr.value);if(!Number.isInteger(n)||n<1)return toast('Price must be a whole number above 0');r.price=n}
   if(await done(sb.from('products').update(r).eq('id',row.dataset.id).select('id'),'Saved',['product_update','products',row.dataset.id,r],true))show()}
  else if(act==='ptog'){const on=b.dataset.on!=='true';if(await done(sb.from('products').update({active:on}).eq('id',row.dataset.id).select('id'),on?'Product is visible':'Product hidden',['product_visibility','products',row.dataset.id,{active:on}],true))show()}
  else if(act==='vst'){const s=b.dataset.s;if(s!=='approved'&&!confirm(`Set this vendor to ${s}? They lose seller access while ${s}.`))return;
   if(await done(sb.rpc('approve_vendor',{p_user:row.dataset.uid,p_status:s}),'Vendor '+s)){VEND=[];show()}}
  else if(act==='wadj'){const amt=Number(prompt('Amount in ₦ (use a minus to deduct, e.g. -500)',''));if(!amt)return;const note=(prompt('Reason (required, shown in their wallet history)','')||'').trim();if(note.length<3)return toast('A reason is required');
   if(await done(sb.rpc('admin_adjust_wallet',{p_user:row.dataset.id,p_amount:amt,p_note:note}),'Wallet updated')){users=[];show()}}
  else if(act==='setsave'){const c=Number($('#s-comm').value),f=Number($('#s-fee').value);if(!(c>=0&&c<=50)||!(f>=0&&f<=100000))return toast('Commission must be 0–50 and delivery 0–100000');
   await done(sb.from('settings').update({commission_pct:c,delivery_fee:f}).eq('id',1).select('id'),'Settings saved',null,true)}
  else if(act==='ppaid'){const ref=(prompt('Payment reference (for example the bank transfer ID)','')||'').trim();if(ref.length<3)return toast('A payment reference is required');
   if(await done(sb.rpc('mark_payout_paid',{p_id:row.dataset.id,p_ref:ref}),'Payout marked paid',['payout_paid','payouts',row.dataset.id,{ref}]))show()}
  else if(act==='oexp')csv('kampza-orders.csv',[['Order','Customer','Phone','Items','Total','Payment','Paid','Status','Date'],...(app._o||[]).map(({o,items})=>[o.code,uname(o.buyer_id),o.phone,items.map(i=>`${i.qty}x ${i.name}`).join('; '),o.total,o.pay_method,o.paid,o.status,o.created_at])]);
  else if(act==='cexp')csv('kampza-customers.csv',[['Name','Email','Wallet','Joined'],...users.map(u=>[u.name,u.email,u.balance,u.joined])]);
  else if(act==='inv'){const x=(app._o||[]).find(z=>z.o.id===row.dataset.id),o=x.o,w=window.open('','_blank');if(w){w.document.write(`<title>Invoice ${esc(o.code)}</title><body style="font:14px Inter,sans-serif;max-width:640px;margin:30px auto"><img src="${LOGO}" width="56" style="border-radius:12px"><h2>KAMPZA — Invoice ${esc(o.code)}</h2><p>${esc(uname(o.buyer_id))} · ${esc(o.phone)}<br>${esc(o.address)}<br>${when(o.created_at)}</p><table width="100%" cellpadding="6" border="1" style="border-collapse:collapse">${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.qty)}</td><td>${naira(i.price*i.qty)}</td></tr>`).join('')}<tr><td colspan="2">Delivery</td><td>${naira(o.delivery_fee)}</td></tr><tr><td colspan="2"><b>Total</b></td><td><b>${naira(o.total)}</b></td></tr></table><p>Payment: ${o.pay_method} · ${o.paid?'Paid':'Not yet paid'} · Status: ${esc(o.status)}</p><script>onload=()=>print()<\/script>`);w.document.close()}}
  else if(act==='mtest'||act==='mall'){const subject=$('#m-sub').value.trim(),message=$('#m-msg').value.trim();if(subject.length<3||message.length<5)return toast('Add a subject and a message');if(act==='mall'&&!confirm('Send this to ALL customers now? This cannot be undone.'))return;
   const {data,error}=await sb.functions.invoke('admin-broadcast',{body:{token:session.access_token,subject,message,test:act==='mtest'}});if(error||!data?.ok)toast(data?.error||error?.message||'Could not send');else{toast(`Sent to ${data.sent} of ${data.total}`);audit(act==='mtest'?'email_test':'email_broadcast','email',subject,{sent:data.sent,total:data.total})}}
  else if(act==='dsel'){const m=b.dataset.m;document.querySelectorAll('.dchk').forEach(c=>c.checked=m==='all'||(m==='test'&&c.dataset.t==='1'))}
  else if(act==='dbackup'){const out={exported_at:new Date().toISOString()};for(const t of ['orders','order_items','products','vendors','wallet_tx','payouts','quotes']){const {data,error}=await sb.from(t).select('*').limit(10000);if(error)return toast('Backup stopped at '+t+': '+friendly(error.message));out[t]=data}
   dl('kampza-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(out,null,1));toast('Backup downloaded')}
  else if(act==='dorders'){if(!typed('This deletes ALL orders, their items and their status history.','CLEAR ORDERS'))return;
   const {data,error}=await sb.rpc('admin_clear_orders',{p_confirm:'CLEAR ORDERS',p_force:$('#d-force').checked});if(error)toast(friendly(error.message));else{toast(`Deleted ${data} orders`);show()}}
  else if(act==='dprods'){const ids=[...document.querySelectorAll('.dchk:checked')].map(c=>c.value);if(!ids.length)return toast('Select at least one product');if(!typed(`This deletes ${ids.length} product(s).`,'DELETE'))return;
   const {data,error}=await sb.from('products').delete().in('id',ids).select('id');if(error)return toast(friendly(error.message)+(/order_items/.test(error.message)?' Delete the orders first.':''));
   if(!data.length)return toast('Nothing was deleted. Your admin role may not allow it.');toast(data.length<ids.length?`Only ${data.length} of ${ids.length} deleted`:`Deleted ${data.length} products`);audit('demo_products_delete','products','bulk',{count:data.length});show()}
  else if(act==='dvend'){if(!typed('This deletes this vendor record.','DELETE'))return;
   const {data,error}=await sb.from('vendors').delete().eq('id',row.dataset.id).select('id');if(error)return toast(friendly(error.message));if(!data.length)return toast('Nothing was deleted. Only an owner can delete vendors.');toast('Vendor deleted');audit('demo_vendor_delete','vendors',row.dataset.id,{});VEND=[];show()}
 }finally{b.disabled=false}
});

async function signOut(){await sb.auth.signOut();location.reload()}$('#out').onclick=signOut;
let pin='',busy=false;const lsub=$('#lsub'),dots=$('#dots');
const paint=()=>dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<pin.length));
const msg=(t,bad)=>{lsub.textContent=t;lsub.classList.toggle('err',!!bad)};
function unlock(){document.documentElement.classList.remove("resume");applyTheme(session?.user?.user_metadata?.admin_theme==='light'?'light':'dark');document.body.classList.remove('locked');$('#lock').hidden=true;show()}
async function tryPin(){
 busy=true;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=true);msg('Checking…');let r=null,fail=false;
 try{const {data,error}=await sb.functions.invoke('admin-pin-login',{body:{pin}});r=data;if(error&&!data)fail=true;
  if(r?.ok){let v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'email'});if(v.error)v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'magiclink'});
   if(v.error||!v.data?.session)fail=true;else{session=v.data.session;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}fail=true}}
 }catch(e){fail=true}
 busy=false;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=false);pin='';paint();dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');
 if(fail||!r)msg('Could not log in. Check your connection and try again.',true);else if(r.locked)msg('Too many wrong tries. Wait '+Math.ceil(r.seconds/60)+' min.',true);else msg('Wrong PIN. '+r.left+' '+(r.left===1?'try':'tries')+' left.',true);
}
function press(d){if(busy||pin.length>=4)return;pin+=d;paint();if(pin.length===4)tryPin()}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='pback')return;press(b.textContent.trim())});
$('#pback').onclick=()=>{if(!busy){pin=pin.slice(0,-1);paint()}};
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace'&&!busy){pin=pin.slice(0,-1);paint()}});
(async()=>{try{const {data:{session:cur}}=await sb.auth.getSession();if(cur){session=cur;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}await sb.auth.signOut()}}catch(e){}document.documentElement.classList.remove('resume')})();
setTimeout(()=>document.documentElement.classList.remove('resume'),9000);

</script></body></html>
