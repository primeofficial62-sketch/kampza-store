<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>KAMPZA Store</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('kz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<script>(function(){var msg='';addEventListener('error',function(e){if(e&&e.message)msg=e.message+(e.filename?' ('+String(e.filename).split('/').pop()+':'+e.lineno+')':'')});setTimeout(function(){var d=document.documentElement;if(d.classList.contains('ok')||!msg)return;d.classList.add('ok');var a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:40px 16px;text-align:center"><b>The store could not start.</b><br><br><small>'+msg.replace(/[<>&]/g,'')+'</small><br><br><button class="btn" onclick="location.reload()">Reload</button></div>'},4000)})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF7628;--c:#252525;--bg:#FFFFFF;--g:#F4F4F4;--m:#6b6b6b;--b:#e8e8e8;--r:14px;--pad:14px;--gap:10px;--hh:160px;--lh:54px;color-scheme:light}
@media(min-width:560px){:root{--pad:18px;--gap:12px;--hh:190px}}
@media(min-width:768px){:root{--pad:20px;--gap:14px;--hh:220px;--lh:64px}}
@media(min-width:1024px){:root{--pad:24px;--hh:240px}}
*{box-sizing:border-box;margin:0;min-width:0;-webkit-tap-highlight-color:transparent}
/* nothing is painted until we know the user is signed in (no flash before a redirect to login) */
html:not(.ok) body{visibility:hidden}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{font:400 14px/1.4 Inter,system-ui,sans-serif;color:var(--c);background:var(--bg);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
h1,h2,h3{font-family:Sora,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding:8px 0 6px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.logo img{height:var(--lh);width:auto;max-width:70vw;object-fit:contain}
.logo b{font:700 28px/1 Sora;letter-spacing:.5px}
.bell{position:relative;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bell svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell span{position:absolute;top:1px;right:1px;background:var(--o);color:#fff;font:700 10px Inter;min-width:18px;height:18px;padding:0 3px;border-radius:9px;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--g);border:1px solid var(--b);border-radius:999px;padding:0 14px;margin-top:6px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:0;font:inherit;font-size:16px;color:var(--c);width:100%}
.search input::placeholder{color:var(--m);font-size:14px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-top:12px;touch-action:pan-y;user-select:none;height:var(--hh)}
.track{position:relative;height:100%}.snap .sl{transition:none!important}
.sl{position:absolute;inset:0;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .7s;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.sl::after{content:"";position:absolute;right:-50px;top:-30px;width:200px;height:240px;background:var(--a);border-radius:45% 55% 40% 60%;transform:rotate(-18deg);opacity:.95}
.sl>*{position:relative;z-index:1}
.sl .t{color:var(--o);font:600 13px Inter}
.sl h2{font-size:clamp(18px,5vw,24px);line-height:1.2;max-width:58%}
.sl .em{position:absolute;right:14px;top:50%;transform:translateY(-52%);font-size:clamp(56px,16vw,88px);z-index:1;filter:drop-shadow(0 6px 10px #0006)}
.btn{background:var(--o);color:#fff;font-weight:600;border-radius:10px;padding:8px 14px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--g);color:var(--c)}
.btn.full{display:block;width:100%;padding:13px;text-align:center;text-decoration:none;margin-top:10px}
.btn.danger{background:#d92d20}
.sl .btn{align-self:flex-start;margin-top:6px;font-size:13px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3}
.dots i{width:6px;height:6px;border-radius:99px;background:#ffffff80;transition:.3s}
.dots i.on{background:#fff;width:16px}
.cats,.row{display:flex;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding-left:var(--pad);padding-right:0;scroll-padding-inline:var(--pad);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cats::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.cats::after,.row::after{content:"";flex:0 0 calc(var(--pad) - var(--gap) + 1px)}
.cats{padding-top:14px;padding-bottom:12px;border-bottom:1px solid var(--b)}
.cat{flex:0 0 68px;scroll-snap-align:start;text-align:center;font-size:11.5px;line-height:1.2}
.cat i{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#FF762818;font-size:25px;margin:0 auto 6px;font-style:normal;transition:transform .15s}
.cat span{display:block;min-height:2.4em;overflow-wrap:anywhere}
.cat:active i{transform:scale(.92)}
@media(min-width:1024px){.cat{flex-basis:92px;font-size:12.5px}.cat i{width:64px;height:64px;font-size:28px}.cats{justify-content:safe center}}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;gap:10px}
.sh h2{font-size:17px}.sh a{color:var(--o);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;padding:6px 0}
.sh2{font-size:16px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:840px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1120px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{border:1px solid var(--b);border-radius:var(--r);padding:8px;position:relative;display:flex;flex-direction:column;gap:6px;background:var(--bg);height:100%}
.pimg{aspect-ratio:1/.85;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:clamp(36px,11vw,50px);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain;padding:6px}
@media(min-width:768px){.pimg{font-size:56px}}
.disc{position:absolute;top:12px;left:12px;background:var(--o);color:#fff;font:600 11px Inter;padding:2px 8px;border-radius:99px;z-index:1}
.hb{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);box-shadow:0 1px 4px #0002;display:grid;place-items:center;z-index:1}
.hb svg{width:17px;height:17px;fill:none;stroke:var(--c);stroke-width:2;transition:.2s}
.hb.on svg{fill:var(--o);stroke:var(--o);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.card h3{font:500 13.5px/1.3 Inter;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere}
.pr{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:auto;overflow-wrap:anywhere}
.old{color:var(--m);text-decoration:line-through;font-size:11px;font-weight:400}
.card .btn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;padding:0 6px;min-height:40px}
.card .btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;flex:none}
.row{align-items:stretch;padding-bottom:6px}
.row .card{flex:0 0 max(124px,42%);scroll-snap-align:start;height:auto}
@media(min-width:560px){.row .card{flex-basis:calc((100% - 2*var(--gap))/3.4)}}
@media(min-width:1024px){.row .card{flex-basis:calc((100% - 3*var(--gap))/4.4)}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--b);z-index:30;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1 1 0;display:grid;justify-items:center;gap:4px;padding:10px 0 8px;font:500 11px Inter;color:var(--m);position:relative;white-space:nowrap}
@media(max-width:360px){nav button{font-size:10px}}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
nav .on{color:var(--o);font-weight:600}nav .on svg{fill:var(--o)}
nav .cb{position:absolute;top:1px;left:calc(50% + 4px);background:var(--o);color:#fff;font:700 10px Inter;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.nt{padding:12px;border-radius:12px;border:1px solid var(--b);margin-bottom:10px;display:grid;gap:4px}.nt.un{background:#FF762812;border-color:#FF762866}.nt small,small{color:var(--m)}
.soon{text-align:center;padding:60px 16px;color:var(--m)}.soon b{display:block;font-size:38px;margin-bottom:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}.top h1{font-size:22px;overflow-wrap:anywhere}
.sub{color:var(--m);margin:-6px 0 14px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media(min-width:560px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:840px){.cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1120px){.cgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ccard{display:block;width:100%;text-align:left;border:1px solid var(--b);border-radius:var(--r);overflow:hidden;background:var(--bg);transition:transform .15s,box-shadow .15s}
.ccard:active{transform:scale(.98)}
.ccard .im{height:92px;display:grid;place-items:center;font-size:34px;letter-spacing:3px;background:linear-gradient(135deg,#FF76280f,#f4f4f4)}
.ccard .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 10px 12px}
.ccard b{display:block;font:600 14px/1.2 Sora}
.cv{width:30px;height:30px;border-radius:50%;background:#FF762820;color:var(--o);display:grid;place-items:center;font:700 20px/1 Inter;flex:none;padding-bottom:2px}
.line{display:flex;gap:10px;border:1px solid var(--b);border-radius:var(--r);padding:8px;margin-bottom:10px;align-items:center}
.line .pimg{width:68px;flex:none;aspect-ratio:1;font-size:32px}
.line .mid{flex:1;display:grid;gap:3px}.line b{overflow-wrap:anywhere}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--g);border-radius:99px}
.qty button{width:34px;height:34px;font-size:18px;border-radius:50%}.qty span{min-width:22px;text-align:center;font-weight:600}
.rm{color:var(--m);font-size:12px;text-decoration:underline;padding:4px}
.sum{position:static;background:var(--bg);border:1px solid var(--b);border-radius:var(--r);padding:12px;display:grid;gap:10px;box-shadow:0 -4px 16px #0000000d}
.sum div{display:flex;justify-content:space-between;font-weight:700;font-size:16px}.sum .btn{padding:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--b)}.set small{display:block}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw s{position:absolute;inset:0;background:#cfcfcf;border-radius:99px;transition:.2s;pointer-events:none}
.sw s::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+s{background:var(--o)}.sw input:checked+s::after{transform:translateX(18px)}
/* account */
.prof{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#FF76280d;border:1px solid #FF762826;border-radius:var(--r);padding:14px}
.av{width:64px;height:64px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font:700 26px Sora;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.pm{flex:1;display:grid;gap:3px;justify-items:start}.pm b{font:600 17px Sora;overflow-wrap:anywhere}.pm small{overflow-wrap:anywhere}
.badge{background:#FF762822;color:var(--o);font:600 12px Inter;padding:3px 10px;border-radius:99px}
.badge.no{background:#fde8e6;color:#d92d20}
.qt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.qt button{border:1px solid var(--b);background:#FF76280a;border-radius:var(--r);padding:12px 2px 10px;display:grid;justify-items:center;gap:2px;font-weight:600;font-size:12.5px}
.qt small{font-size:11px;font-weight:400}
.ico{width:42px;height:42px;border-radius:50%;background:#FF762818;display:grid;place-items:center;margin-bottom:4px;flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:var(--o);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box{border:1px solid var(--b);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.pad{padding:12px;display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--b)}
.box .li:last-child{border-bottom:0}
.li .ic{width:26px;flex:none}.li .ic svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.li>span:nth-child(2){flex:1;display:grid}.li b{font-weight:500;font-size:15px}
.li.tint{background:#FF76280d;border:1px solid #FF762826;border-radius:var(--r);margin-top:14px}
.li.tint .ic svg{stroke:var(--o)}
.out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border-radius:var(--r);background:#ff76281a;color:#e5560b;font-weight:600}
.out svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{text-align:center;color:var(--m);font-size:12px;margin-top:18px}
/* forms + pages */
.fld{display:grid;gap:6px;margin-bottom:12px}.fld label{font-weight:600;font-size:13px}
input,textarea,select{font:inherit;font-size:16px;color:var(--c);border:1px solid var(--b);border-radius:10px;padding:11px 12px;background:var(--bg);width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px #FF762826}
input:disabled{background:var(--g);color:var(--m)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{border-top:1px solid var(--b);padding-top:8px;font-size:16px}
.st{background:#FF762822;color:var(--o);font:600 11px Inter;padding:3px 9px;border-radius:99px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:8px}
.opt input{width:auto;accent-color:var(--o)}
.bal{background:var(--o);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px}.bal small{display:block;color:#fff;opacity:.85}.bal b{font:700 30px Sora}
details{border-bottom:1px solid var(--b);padding:13px 0}summary{font-weight:600;cursor:pointer}details p{margin-top:8px;color:var(--m)}
.terms h3{font-size:15px;margin:16px 0 4px}.terms p{color:var(--m)}
.warn{background:#fde8e6;color:#9b1c14;border-radius:var(--r);padding:12px;margin-bottom:14px}
[data-open]{cursor:pointer}
.chat{display:grid;gap:10px;padding-bottom:10px}
.bub{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.bub.bot{background:var(--g);border-bottom-left-radius:4px;justify-self:start}
.bub.me{background:var(--o);color:#fff;border-bottom-right-radius:4px;justify-self:end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chips button{border:1px solid var(--o);color:var(--o);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--bg)}
.cbar{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0;z-index:5}.cbar input{border-radius:99px}.cbar .btn{border-radius:99px;padding:0 20px}
.pd-img{position:relative;aspect-ratio:1/.8;border-radius:var(--r);background:var(--g);display:grid;place-items:center;font-size:110px;overflow:hidden}
.pd-img img{width:100%;height:100%;object-fit:contain;padding:12px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}.thumbs button{flex:0 0 58px;height:58px;border:1px solid var(--b);border-radius:10px;overflow:hidden;background:var(--g)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pd-n{font:600 19px/1.3 Sora;margin-top:14px;overflow-wrap:anywhere}
.pd-p{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:8px 0}.pd-p b{font:700 25px Sora}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:var(--g);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:500}.tag.ok{background:#e6f6ec;color:#1a7f43}.tag.no{background:#fde8e6;color:#b42318}
.pdesc{color:#444;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.spec{width:100%;border-collapse:collapse}.spec td{padding:11px 12px;border-bottom:1px solid var(--b);vertical-align:top;overflow-wrap:anywhere}.spec tr:last-child td{border:0}.spec td:first-child{color:var(--m);width:40%;background:#fafafa}
.pbar{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);border:1px solid var(--b);border-radius:var(--r);padding:10px;margin-top:18px;box-shadow:0 -4px 16px #0000000d;z-index:5}.pbar .btn{flex:1;padding:13px;text-align:center}.pbar .btn.alt{background:#252525}
.btn[disabled]{opacity:.5;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#252525;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sk{background:linear-gradient(90deg,var(--g) 25%,#ececec 37%,var(--g) 63%);background-size:400% 100%;animation:shim 1.3s infinite;border-radius:var(--r);min-height:210px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.bar select{width:auto;padding:8px 10px;font-size:14px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}.chk input{width:auto;accent-color:var(--o)}
.pdw{display:grid;gap:0 32px}
@media(min-width:640px){.pdw{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.pdl{position:sticky;top:150px}}
.stars{color:#f5a623;letter-spacing:1px;font-size:12px}
.rv{border-bottom:1px solid var(--b);padding:10px 0}.rv p{margin-top:4px;color:#444}
.rate button{font-size:28px;color:#ccc;padding:0 2px}.rate button.on{color:#f5a623}
.steps{display:flex;gap:4px;margin:4px 0 8px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--b)}.steps i.on{background:var(--o)}
.cartw{display:grid;gap:10px}
@media(min-width:760px){.cartw{grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}.cartw .sum{position:static}}
@media(max-width:340px){.qt{grid-template-columns:repeat(2,minmax(0,1fr))}.pbar{flex-direction:column}}
.cat{flex:0 0 80px;font-size:11px}.cat span{overflow-wrap:normal;word-break:normal;hyphens:none;min-height:2.4em}
@media(min-width:768px){.cat{flex-basis:92px;font-size:12px}}
@media(max-width:350px){.card .btn{font-size:12px}.card .btn svg{display:none}}
.gps{margin-bottom:12px}
.gstat{padding:10px 12px;border-radius:10px;background:var(--g);margin:8px 0;font-size:13px}
.gstat.ok{background:#e6f6ec;color:#1a7f43}.gstat.bad{background:#fde8e6;color:#b42318}

.tl{display:grid;margin:8px 0}

.tl div::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--b);flex:none;margin-top:3px;z-index:1}
.tl div::after{content:"";position:absolute;left:6px;top:18px;bottom:0;width:2px;background:var(--b)}

.tl div.on{color:var(--c)}.tl div.on::before,.tl div.on::after{background:var(--o)}

input[readonly]{background:var(--g);color:var(--m);cursor:not-allowed}

/* ===== promo slide ===== */
.pr-sl{padding:12px 18px}.pr-sl h2{-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;max-width:56%}
.pr-sl .t{background:var(--o);color:#fff;padding:3px 10px;border-radius:99px;align-self:flex-start;font-size:12px}
.pp{display:flex;gap:8px;align-items:baseline}.pp b{font:700 20px Sora}.pp s{opacity:.6;font-size:12px}
.sl .em img{width:clamp(76px,22vw,120px);height:clamp(76px,22vw,120px);object-fit:contain;border-radius:14px;background:#fff}
/* ===== floating nav (same size, rounded, lifted) ===== */
nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--b);border-radius:26px;padding:8px 6px 10px;box-shadow:0 8px 28px #0000002b}
body{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.pbar,.sum,.cbar{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(116px + env(safe-area-inset-bottom,0px))}
/* ===== install popup ===== */
#inst{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--b);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px #0000003a}
#inst[hidden]{display:none}#inst img{width:44px;height:44px;border-radius:10px;flex:none}
#inst div{flex:1;display:grid}#inst small{line-height:1.3}#inst .btn{flex:none}#inst #insx{font-size:24px;padding:0 4px;color:var(--m)}
.wab{background:#25D366!important}
/* ===== new-message popup (top of screen) ===== */
#mpop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;width:calc(100% - 24px);max-width:520px;z-index:80;display:flex;align-items:center;gap:10px;text-align:left;background:#252525;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0000004d;transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#mpop.s{transform:translate(-50%,0)}
#mpop .mi{font-size:24px;flex:none}#mpop .mt{flex:1;display:grid;min-width:0}
#mpop .mt b{font:600 14px Sora}#mpop .mt small{color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mpop .mg{color:var(--o);font-weight:600;font-size:13px;flex:none}
/* the AI assistant has been removed; keep any leftover widget hidden */
#aibox,.fab{display:none!important}
/* ===== verified vendor badge ===== */
.vb{display:inline-flex;align-self:flex-start;background:#1d9bf018;color:#1d7fd6;font:600 11px Inter;padding:2px 8px;border-radius:99px}
/* ===== payment states + receipt ===== */
.st.pend{background:#fff3cd;color:#8a6100}.st.ok{background:#e6f6ec;color:#1a7f43}
.btn.dark{background:#252525;color:#fff}
.rcw{max-width:480px;margin:0 auto}.rcw img{width:100%;border-radius:16px;box-shadow:0 8px 30px #0002}
.rcb{display:flex;gap:10px;margin:14px auto;max-width:480px}.rcb .btn{flex:1;padding:13px;text-align:center}.rcb .btn.alt{background:#252525}
.pendbox{background:#fff8e1;border:1px solid #ffe08a;color:#7a5600;border-radius:var(--r);padding:12px;margin-top:10px;font-size:13px;line-height:1.45}
.okbox{background:#e6f6ec;border:1px solid #b7e4c7;color:#1a7f43;border-radius:var(--r);padding:12px;margin-top:10px;font-size:13px;line-height:1.45}
[data-theme=dark] .st.pend,[data-theme=dark] .pendbox{background:#3a2f0b;color:#ffd666;border-color:#5c4a12}
[data-theme=dark] .st.ok,[data-theme=dark] .okbox{background:#12301e;color:#6fdc9a;border-color:#1d4a2e}
/* ===== openable notifications ===== */
button.nt{display:grid;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .1s}

/* ===== dark mode ===== */
:root[data-theme=dark]{--c:#f2f2f2;--bg:#141414;--g:#232323;--m:#a0a0a0;--b:#34343a;color-scheme:dark}

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF7628"><link rel="apple-touch-icon" href="icon-192.png"><script>
(()=>{
const K=window.KX={payCode:null,PAY:null,conv:null,name:'',ch:null,seen:new Set(),hooks:{}};
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>'₦'+Number(n).toLocaleString('en-NG');
const wa=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='234'+p.slice(1);return p};
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{const r=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Image error')),'image/jpeg',.82)};
 i.onerror=()=>no(new Error('Could not read the image'));i.src=u});

/* ---------- promotions ---------- */
K.promos=(P,rows)=>{(rows||[]).forEach(r=>{const p=P.find(x=>x.id===r.product_id);if(p&&r.promo_price<r.base_price){p.o=r.base_price;p.p=r.promo_price;p.pe=r.ends_at}})};

/* ---------- leave chat page: close realtime channel ---------- */
K.leave=p=>{if(p!=='chat'&&K.ch){try{sb.removeChannel(K.ch)}catch{}K.ch=null}};

/* ---------- pay by transfer ---------- */
const PS={unpaid:['Awaiting payment',''],submitted:['Receipt sent',''],confirmed:['Payment confirmed',''],rejected:['Rejected. Resend receipt','no']};
K.payView=()=>pgHead('Pay by transfer')+'<div id="pay"><div class="sk"></div></div>';
K.hooks.pay=async()=>{
 if(!$('#pay'))return;
 const{data:d,error}=await sb.rpc('order_pay_info',{p_code:K.payCode});
 const el=$('#pay');if(!el)return;
 if(error||!d){el.innerHTML='<div class="warn">'+E(error?.message||'Could not load payment details')+'</div>';return}
 K.PAY=d;
 el.innerHTML=`<div class="nt"><div class="oh"><b>${E(d.code)}</b><span class="st">${M(d.total)}</span></div><small>Send each amount below straight to that vendor's account, then upload your receipt.</small></div>`
 +d.vendors.map(v=>{
  const s=PS[v.pay_status]||PS.unpaid,open=v.pay_status==='unpaid'||v.pay_status==='rejected',hasBank=v.bank_name&&v.account_number;
  return `<div class="box pad" style="margin-bottom:12px"><div class="oh"><b>${E(v.business_name)}</b><span class="badge ${s[1]}">${s[0]}</span></div>`
  +v.items.map(i=>`<div class="oh" style="font-weight:400"><span>${i.qty}× ${E(i.name)}</span><span>${M(i.price*i.qty)}</span></div>`).join('')
  +(v.has_fee?`<div class="oh"><small>Delivery</small><small>${M(d.delivery_fee)}</small></div>`:'')
  +`<div class="oh tot"><span>Amount to pay</span><b>${M(v.amount)}</b></div>`
  +(hasBank?`<div class="box"><table class="spec"><tr><td>Bank</td><td>${E(v.bank_name)}</td></tr><tr><td>Account name</td><td>${E(v.account_name)}</td></tr><tr><td>Account number</td><td><b>${E(v.account_number)}</b> <button class="rm" data-copy="${E(v.account_number)}">Copy</button></td></tr></table></div>`:'<div class="warn">This vendor has no bank details yet. Message them.</div>')
  +(open&&hasBank?`<div class="fld" style="margin:8px 0 0"><label for="rc-${v.vendor_id}">Receipt photo</label><input id="rc-${v.vendor_id}" type="file" accept="image/*"></div><button class="btn full" data-sendrc="${v.vendor_id}">I have paid · send receipt</button>`:'')
  +`<button class="btn full ghost" data-chatv="${v.vendor_id}">Message vendor</button>`
  +(v.phone?`<a class="btn full ghost" href="https://wa.me/${wa(v.phone)}" target="_blank" rel="noopener">WhatsApp vendor</a>`:'')+'</div>'}).join('')};
async function sendReceipt(vid,btn){
 const f=$('#rc-'+vid)?.files?.[0];if(!f){toast('Choose your receipt photo first');return}
 const v=K.PAY.vendors.find(x=>x.vendor_id===vid);btn.disabled=true;btn.textContent='Sending…';
 try{
  const a=await sb.rpc('start_chat',{p_vendor:vid});if(a.error)throw a.error;
  const cid=a.data,blob=await shrink(f),path=cid+'/'+Date.now()+'.jpg';
  const up=await sb.storage.from('chat-files').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
  const m=await sb.from('messages').insert({conversation_id:cid,sender_id:U.id,body:'Payment receipt for order '+K.payCode+' · '+M(v.amount),image_path:path,order_code:K.payCode});if(m.error)throw m.error;
  const s=await sb.rpc('submit_transfer',{p_code:K.payCode,p_vendor:vid});if(s.error)throw s.error;
  toast('Receipt sent. The vendor will confirm your payment');notif('Receipt sent',K.payCode+' · '+M(v.amount));
 }catch(err){toast(err.message||'Could not send receipt')}
 K.hooks.pay();loadServer()}

/* ---------- chat ---------- */
K.chatsView=()=>pgHead('Messages')+'<div id="cl"><div class="sk"></div></div>';
K.hooks.chats=async()=>{
 const{data,error}=await sb.rpc('chat_list');const el=$('#cl');if(!el)return;
 if(error){el.innerHTML='<div class="warn">'+E(error.message)+'</div>';return}
 el.innerHTML=data.length?data.map(c=>`<button class="line" style="width:100%;text-align:left" data-chat="${c.conv_id}" data-nm="${E(c.other_name)}"><span class="av" style="width:44px;height:44px;font-size:18px">${E((c.other_name||'?')[0].toUpperCase())}</span><span class="mid"><b>${E(c.other_name)}${c.as_vendor?' <small>(customer)</small>':''}</b><small>${E(c.last_text||'No messages yet')}</small></span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</button>`).join(''):empty('💬','No conversations yet. Tap Chat on any product to message the vendor.')};
K.chatView=()=>pgHead(E(K.name||'Chat'))+'<div class="chat" id="msgs" style="min-height:45vh"></div><div class="cbar"><label class="btn ghost" style="display:grid;place-items:center;padding:0 14px;cursor:pointer" aria-label="Send photo">📷<input id="cimg" type="file" accept="image/*" hidden></label><input id="cin" placeholder="Type a message…" maxlength="1000" autocomplete="off" enterkeyhint="send"><button class="btn" data-csend>Send</button></div>';
function addMsg(m){
 if(K.seen.has(m.id))return;K.seen.add(m.id);
 const box=$('#msgs');if(!box)return;
 const d=document.createElement('div');d.className='bub '+(m.sender_id===U.id?'me':'bot');
 if(m.order_code){const s=document.createElement('small');s.textContent='Order '+m.order_code;s.style.cssText='display:block;opacity:.8';d.appendChild(s)}
 if(m.image_path){const im=document.createElement('img');im.alt='Photo';im.style.cssText='max-width:100%;border-radius:10px;margin:4px 0';d.appendChild(im);
  sb.storage.from('chat-files').createSignedUrl(m.image_path,3600).then(r=>{if(r.data)im.src=r.data.signedUrl})}
 if(m.body){const t=document.createElement('div');t.textContent=m.body;d.appendChild(t)}
 box.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
K.hooks.chat=async()=>{
 if(!K.conv||!$('#msgs'))return;
 K.seen=new Set();if(K.ch){try{sb.removeChannel(K.ch)}catch{}K.ch=null}
 const id=K.conv;
 const[r,l]=await Promise.all([sb.from('messages').select('*').eq('conversation_id',id).order('created_at').limit(150),sb.rpc('chat_list')]);
 if(K.conv!==id||!$('#msgs'))return;
 if(!K.name&&l.data){const c=l.data.find(x=>x.conv_id===id);if(c){K.name=c.other_name;const h=$('.top h1');if(h)h.textContent=K.name}}
 if(r.error){toast('Could not load messages');return}
 r.data.forEach(addMsg);
 sb.rpc('mark_chat_read',{p_conv:id});
 K.ch=sb.channel('kz-msg-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},p=>{addMsg(p.new);if(p.new.sender_id!==U.id)sb.rpc('mark_chat_read',{p_conv:id})}).subscribe()};
async function send(body,path){
 if(!K.conv)return;
 const r=await sb.from('messages').insert({conversation_id:K.conv,sender_id:U.id,body:body||null,image_path:path||null}).select().single();
 if(r.error){toast('Message not sent');return false}addMsg(r.data);return true}
async function openChat(vid){
 const{data,error}=await sb.rpc('start_chat',{p_vendor:vid});
 if(error){toast(error.message||'Could not open chat');return}
 K.conv=data;K.name='';pg='chat';draw()}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const g=s=>e.target.closest(s);let x;
 if(x=g('[data-chatv]')){openChat(x.dataset.chatv);return}
 if(x=g('[data-chat]')){K.conv=x.dataset.chat;K.name=x.dataset.nm||'';pg='chat';draw();return}
 if(x=g('[data-copy]')){try{await navigator.clipboard.writeText(x.dataset.copy);toast('Account number copied')}catch{toast(x.dataset.copy)}return}
 if(x=g('[data-sendrc]')){sendReceipt(x.dataset.sendrc,x);return}
 if(g('[data-csend]')){const i=$('#cin'),t=i.value.trim();if(!t)return;i.value='';if(!await send(t))i.value=t;return}
});
document.addEventListener('keydown',async e=>{if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();const t=e.target.value.trim();if(!t)return;e.target.value='';if(!await send(t))e.target.value=t}});
document.addEventListener('change',async e=>{
 if(e.target.id!=='cimg'||!e.target.files[0])return;
 const f=e.target.files[0];e.target.value='';toast('Sending photo…');
 try{const blob=await shrink(f),path=K.conv+'/'+Date.now()+'.jpg';
  const up=await sb.storage.from('chat-files').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
  await send('',path)}catch(err){toast(err.message||'Could not send photo')}});

/* ---------- PWA ---------- */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL='https://fcgvmxkxwgymgqcbtzjd.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZ3ZteGt4d2d5bWdxY2J0empkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODgyODcsImV4cCI6MjEwODY2NDI4N30.SEROg_J5x2dldpI6buHKYVQbuuyzM4bOJLHPYDWtIbM',AUTH_URL='auth.html#signin',MAIL_ENDPOINT=SUPABASE_URL+'/functions/v1/notify',CATALOG_URL='deals.json';
const SUPPORT_EMAIL='kampzastore@gmail.com',WHATSAPP='2349059538257',VERSION='2.6.0';
const MAIL_FN=['notify-ts'];
async function callFn(names,body){let last;for(const n of names){try{const r=await fetch(SUPABASE_URL+'/functions/v1/'+n,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify(body)});if(r.status===404)continue;return await r.json()}catch(e){last=e}}throw last||new Error('function not found')}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dt=t=>new Date(t).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});

const showPage=()=>document.documentElement.classList.add('ok');

/* ================= DATA (deals.json overrides this fallback) ================= */
const SLIDES=[
 ['New Arrivals','Better Choices. Brighter Days.','🎧','#FF7628'],
 ['Campus Essentials','Everything You Need, Closer.','🎒','#e8590c'],
 ['Special Deals','More Finds. Smarter Shopping.','🏷️','#ff9142'],
 ['Everyday Lifestyle','Your Campus. Your Marketplace.','👟','#d9480f'],
 ['Tech Picks','Power Up Your Study Game.','💻','#ff6a00']];
const CATS=[['Electronics','💻','💻📱🎧'],['Fashion','👕','👕👟👜'],['Home & Living','🏠','🛋️🪴💡'],['Beauty','💄','💄🧴🪞'],['Appliances','🧺','🍳🥤🔌'],['Groceries','🛒','🥦🍅🫒'],['Sports & Outdoors','⚽','⚽👟🏋️'],['Books & Stationery','📚','📚✏️🎒']];
let AV=[],P=[],FLASH=[],FEE=500,LOADED=false,SORT='new',INSTOCK=false,ADDR=[],LASTSIG='',PLACING=false;
let CKEY=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
const STEPS=['processing','packed','shipped','delivered'],cap=t=>t?t[0].toUpperCase()+t.slice(1):'';
/* a customer can cancel only while every live item is still Processing (the database enforces this too) */
const canCancel=o=>!['cancelled','completed'].includes(o.st)&&o.items.some(i=>i.s==='processing')&&o.items.every(i=>i.s==='processing'||i.s==='cancelled');
const cancelBtn=o=>canCancel(o)?`<button class="btn full danger" data-cancel="${esc(o.id)}">Cancel order</button>`:'';
const byId=id=>P.find(x=>x.id===id);
/* approved vendors get a verified badge (ids come from the approved_vendor_ids() database function) */
const vbadge=id=>AV.includes(id)?'<span class="vb" title="Verified vendor">✓ Verified</span>':'';
/* true when the product belongs to the signed-in user: vendors can never buy their own products */

/* ===== GPS + TRACKING ===== */
let GM='gps',GEO=null,GWATCH=null,GMAP=null,GMARK=null,GCIR=null,TC=null,LID=0;
try{const g0=JSON.parse(sessionStorage.getItem('kz_gps')||'null');if(g0){GM=g0.GM||'gps';GEO=g0.GEO||null}}catch{}
const gsave=()=>{try{sessionStorage.setItem('kz_gps',JSON.stringify({GM,GEO}))}catch{}};
function addrMode(){const gps=GM==='gps';
 ['cp','hs'].forEach(i=>{const e=$('#'+i);if(!e)return;e.readOnly=gps;
  if(gps){e.placeholder='Filled automatically from GPS';if(GEO&&GEO.cp&&(i==='cp'?GEO.cp:GEO.hs)){e.value=i==='cp'?GEO.cp:GEO.hs;e.dataset.auto='1'}else if(!GEO||e.dataset.auto!=='1')e.value=''}
  else{e.placeholder=i==='cp'?'e.g. FUNAAB main campus':'Hostel name and room number';if(e.dataset.auto){e.value='';delete e.dataset.auto}}});
 const sel=$('#adsel');if(sel){const f=sel.closest('.fld');if(f)f.hidden=gps}}
const gst=(m,c='')=>{const e=$('#gstat');if(e){e.textContent=m;e.className='gstat '+c}};
function gpsBlock(){return `<div class="gps"><label class="opt"><input type="radio" name="gm" value="gps" ${GM==='gps'?'checked':''}><span>Use my GPS location <small>(recommended)</small></span></label><label class="opt"><input type="radio" name="gm" value="manual" ${GM==='manual'?'checked':''}><span>Enter address manually</span></label><div id="gpanel" ${GM==='gps'?'':'hidden'}><div id="gstat" class="gstat">Finding your location…</div><div id="gmap"></div><button class="btn full ghost" style="margin-top:0" data-locate>📍 Find my location again</button><small style="display:block;margin-top:6px">Drag the pin if it is slightly off, then add your hostel and room below.</small></div></div>`}
function gpsInit(){
 if(GMAP){try{GMAP.remove()}catch{}}GMAP=null;GMARK=null;GCIR=null;
 if(GM!=='gps'||!document.getElementById('gmap'))return;
 if(!window.L){gst('Map library did not load. Check your internet and reload.','bad')}
 else{
  GMAP=L.map('gmap').setView(GEO?[GEO.lat,GEO.lng]:[7.2275,3.4375],GEO?17:15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(GMAP);
  setTimeout(()=>{GMAP&&GMAP.invalidateSize()},250)}
 if(GEO)drawPin(GEO.lat,GEO.lng,GEO.acc,true);else locate()}
function drawPin(lat,lng,acc,fit){
 if(!GMAP)return;
 if(!GMARK){
  GMARK=L.marker([lat,lng],{draggable:true}).addTo(GMAP);
  GCIR=L.circle([lat,lng],{radius:acc||10,color:'#FF7628',weight:1,fillOpacity:.12}).addTo(GMAP);
  GMARK.on('dragend',()=>{const p=GMARK.getLatLng();GEO={lat:p.lat,lng:p.lng,acc:GEO?.acc||0,moved:true};GCIR.setLatLng(p);gst('Pin moved. Updating address…');rev(p.lat,p.lng)});
  GMAP.setView([lat,lng],17)}
 else{GMARK.setLatLng([lat,lng]);GCIR.setLatLng([lat,lng]);GCIR.setRadius(acc||10);if(fit)GMAP.setView([lat,lng],17)}}
function locate(){
 if(!navigator.geolocation){gst('GPS is not supported on this device. Please enter your address manually.','bad');return}
 if(GWATCH!=null){navigator.geolocation.clearWatch(GWATCH);GWATCH=null}
 const id=++LID,t0=Date.now();let best=null;
 gst('Finding your location… keep this page open');
 const fin=()=>{if(id!==LID||GWATCH==null)return;navigator.geolocation.clearWatch(GWATCH);GWATCH=null;
  if(!best){gst('Could not get a GPS fix. Move near a window or choose manual address.','bad');return}
  GEO=best;gsave();drawPin(best.lat,best.lng,best.acc,true);
  if(best.acc>100)gst('Weak signal (±'+Math.round(best.acc)+' m). Drag the pin to your exact spot or tap Find again.','bad');
  else gst('Location found (±'+Math.round(best.acc)+' m). Fetching address…','ok');
  rev(best.lat,best.lng)};
 GWATCH=navigator.geolocation.watchPosition(p=>{if(id!==LID)return;const c=p.coords;
   if(!best||c.accuracy<best.acc)best={lat:c.latitude,lng:c.longitude,acc:c.accuracy};
   gst('Improving accuracy… ±'+Math.round(best.acc)+' m');drawPin(best.lat,best.lng,best.acc,false);
   if(best.acc<=25||Date.now()-t0>20000)fin()},
  err=>{if(id!==LID)return;
   if(err.code===3&&best){fin();return}
   if(GWATCH!=null){navigator.geolocation.clearWatch(GWATCH);GWATCH=null}
   gst(err.code===1?'Location permission denied. Allow it in your browser settings or choose manual address.':'Could not get your location. Try again or choose manual address.','bad')},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});
 setTimeout(fin,22000)}
async function rev(lat,lng){
 const put=(cp,hs)=>{if(GEO){GEO.cp=cp;GEO.hs=hs;gsave()}if(GM==='gps')addrMode()};
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=en&lat=${lat}&lon=${lng}`);
  const j=await r.json(),a=j.address||{};
  const campus=[a.university||a.college,a.suburb||a.neighbourhood||a.village||a.town,a.city||a.county,a.state].filter(Boolean).join(', ')||(j.display_name||'').split(',').slice(1,4).join(',').trim()||'GPS location';
  const near=a.building||a.amenity||a.tourism||a.shop||a.leisure||'';
  const spot=[near,[a.house_number,a.road].filter(Boolean).join(' ')].filter(Boolean).join(', ')||a.hamlet||(j.display_name||'').split(',')[0]||'GPS pin';
  if(GEO)GEO.text=j.display_name||campus;
  put(campus,spot);
  gst('Address filled from your GPS'+(GEO?.acc?' (±'+Math.round(GEO.acc)+' m)':'')+'. To type it yourself, choose manual address.','ok')
 }catch{put('GPS '+lat.toFixed(5)+', '+lng.toFixed(5),'GPS pin');gst('Location saved. Address name could not be fetched, so your coordinates were used.','ok')}}

let idx=0,timer,drag=null,N=SLIDES.length;
function goTo(i){if(!$('#track'))return;idx=((i%N)+N)%N;document.querySelectorAll('.sl').forEach((s,j)=>{let o=((j-idx)%N+N)%N;if(o>N/2)o-=N;s.style.transform=`translateX(${o*100}%)`;s.style.opacity=Math.abs(o)>1?0:1;s.setAttribute('aria-hidden',o!==0)});
 document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j==idx))}
function start(){
 const h=$('#hero');if(!h)return;h.classList.add('snap');goTo(0);void h.offsetWidth;h.classList.remove('snap');
 const run=()=>{clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)goTo(idx+1)},3200)};
 run();
 h.onpointerdown=e=>{drag=e.clientX;clearInterval(timer)};
 h.onpointerup=e=>{if(drag!==null&&Math.abs(e.clientX-drag)>40)goTo(idx+(e.clientX<drag?1:-1));drag=null;run()};
 h.onpointercancel=()=>{drag=null;run()}}
function stop(){clearInterval(timer)}

function msgPop(t,b){

function msgWatch(){
 if(!sb||!U||msgWatch.on)return;msgWatch.on=1;
 const busy=()=>pg==='chat'||pg==='chats';
 /* poll: catches anything realtime missed and announces unread messages once on entry */
 const poll=async()=>{
  try{
   const{data}=await sb.from('conversations').select('last_text,last_message_at,vendor_id,buyer_id,vendor_unread,buyer_unread');
   if(!data)return;
   const first=!LASTMSG,all=Math.max(1,...data.map(c=>Date.parse(c.last_message_at)||0));
   const my=data.map(c=>({t:c.last_text,at:Date.parse(c.last_message_at)||0,n:c.vendor_id===U.id?c.vendor_unread:c.buyer_unread})).filter(c=>c.n>0).sort((a,b)=>b.at-a.at);
   if(my.length&&!busy()){
    const tot=my.reduce((a,c)=>a+c.n,0);
    if(first)msgPop('You have '+tot+' unread message'+(tot>1?'s':''),my[0].t||'Tap to open your chats');
    else if(my[0].at>LASTMSG+1000)msgPop('New message',my[0].t||'Tap to open');
   }
   LASTMSG=Math.max(LASTMSG,all);
  }catch(e){console.error(e)}};
 poll();setInterval(()=>{if(!document.hidden)poll()},20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
 /* realtime: instant pop-up when the other person sends a message */
 sb.channel('kz-msg').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
  const m=p.new;if(!m||m.sender_id===U.id)return;
  LASTMSG=Math.max(LASTMSG,Date.parse(m.created_at)||0);
  if(!busy())msgPop('New message',m.body||'📷 Sent a photo')}).subscribe()}

function wrapT(c,t,mw){const out=[];let l='';for(const w of String(t||'').split(/\s+/).filter(Boolean)){const n=l?l+' '+w:w;if(c.measureText(n).width>mw&&l){out.push(l);l=w}else l=n}if(l)out.push(l);return out.length?out:['—']}
function paint(c,o,H){
 const W=760,CX=28,CW=W-56,L=64,R=W-64,IW=R-L,TOP=24,BG='#f3efe8',OR='#FF7628',GR='#1fa65a',INK='#252525',MUT='#7a7a7a';
 const total=H||4000,sp=(t,px)=>{try{c.letterSpacing=px+'px'}catch{}};
 c.textBaseline='alphabetic';
 c.fillStyle=BG;c.fillRect(0,0,W,total);
 /* we draw the body first to learn the height, so the card is painted last behind it using destination-over */
 c.save();
 rr(c,CX,TOP,CW,total-2*TOP,28);c.clip();
 c.fillStyle='#fff';c.fillRect(CX,TOP,CW,total);
 /* header */
 const hg=c.createLinearGradient(CX,TOP,CX+CW,TOP+190);hg.addColorStop(0,'#ff6a13');hg.addColorStop(1,'#ffa05a');
 c.fillStyle=hg;c.fillRect(CX,TOP,CW,176);
 c.fillStyle='rgba(255,255,255,.12)';c.beginPath();c.arc(CX+CW-40,TOP+10,110,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.arc(CX+40,TOP+170,90,0,7);c.fill();
 c.fillStyle='#fff';c.font='700 36px Sora,Inter,sans-serif';sp(0,1);c.textAlign='left';c.fillText('KAMPZA',L,TOP+74);
 c.font='500 14px Inter,sans-serif';c.fillStyle='rgba(255,255,255,.92)';c.fillText('Find It. Get It. Love It.',L,TOP+100);
 c.textAlign='right';c.font='700 12px Inter,sans-serif';sp(0,3);c.fillText('PAYMENT RECEIPT',R,TOP+72);sp(0,0);
 c.font='500 13px Inter,sans-serif';c.fillText('#'+o.id,R,TOP+96);
 c.restore();
 /* badge */
 const bx=W/2,by=TOP+176;
 c.save();c.shadowColor='rgba(0,0,0,.18)';c.shadowBlur=14;c.shadowOffsetY=4;c.fillStyle='#fff';c.beginPath();c.arc(bx,by,46,0,7);c.fill();c.restore();
 c.fillStyle=GR;c.beginPath();c.arc(bx,by,37,0,7);c.fill();
 c.strokeStyle='#fff';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(bx-15,by+1);c.lineTo(bx-4,by+13);c.lineTo(bx+17,by-12);c.stroke();
 let y=by+46+40;
 c.textAlign='center';c.fillStyle=INK;c.font='700 26px Sora,Inter,sans-serif';c.fillText(o.paid?'Payment Successful':'Order Completed',W/2,y);
 y+=52;c.fillStyle=OR;c.font='700 48px Sora,Inter,sans-serif';c.fillText(fmt(o.total),W/2,y);
 y+=30;c.fillStyle=MUT;c.font='400 14px Inter,sans-serif';
 c.fillText(new Date(o.paidAt||o.at).toLocaleString('en-NG',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}),W/2,y);
 y+=36;
 const tear=yy=>{c.fillStyle=BG;c.beginPath();c.arc(CX,yy,15,0,7);c.arc(CX+CW,yy,15,0,7);c.fill();
  c.save();c.setLineDash([7,7]);c.strokeStyle='#ddd6cb';c.lineWidth=2;c.beginPath();c.moveTo(CX+30,yy);c.lineTo(CX+CW-30,yy);c.stroke();c.restore()};
 tear(y);y+=40;
 const lab=(t,x,yy,al='left')=>{c.textAlign=al;c.fillStyle=MUT;c.font='700 11px Inter,sans-serif';sp(0,1.6);c.fillText(t,x,yy);sp(0,0)};
 const val=(t,x,yy,col=INK,al='left')=>{c.textAlign=al;c.fillStyle=col;c.font='600 15px Inter,sans-serif';c.fillText(t,x,yy)};
 const colR=L+IW/2+16;
 lab('RECEIPT NO.',L,y);val(o.id,L,y+22);
 lab('PAYMENT METHOD',colR,y);val(RPAY[o.pay]||'—',colR,y+22);
 y+=62;
 lab('DATE',L,y);val(dt(o.paidAt||o.at),L,y+22);
 lab('STATUS',colR,y);val(o.paid?'PAID':'DELIVERED',colR,y+22,GR);
 y+=62;
 const bt=y;
 lab('BILLED TO',L,y);val(U.name||'Customer',L,y+22);c.fillStyle=MUT;c.font='400 14px Inter,sans-serif';c.textAlign='left';
 if(o.ph||U.phone)c.fillText(o.ph||U.phone,L,y+44);
 y+=70;
 if(o.ad){lab('DELIVER TO',L,y);c.font='500 14.5px Inter,sans-serif';const ls=wrapT(c,o.ad,IW-150);c.fillStyle=INK;c.textAlign='left';ls.forEach((t,i)=>c.fillText(t,L,y+22+i*21));y+=22+ls.length*21+22}
 /* stamp */
 c.save();c.translate(R-82,bt+34);c.rotate(-.24);c.globalAlpha=.88;c.strokeStyle=GR;c.fillStyle=GR;c.lineWidth=4;rr(c,-62,-30,124,60,10);c.stroke();
 c.lineWidth=1.5;rr(c,-57,-25,114,50,7);c.stroke();c.textAlign='center';c.font='700 28px Sora,Inter,sans-serif';sp(0,3);c.fillText(o.paid?'PAID':'DONE',3,10);sp(0,0);c.restore();
 /* items */
 c.textAlign='left';c.fillStyle='#fff3ea';rr(c,L,y,IW,34,17);c.fill();
 c.fillStyle=OR;c.font='700 12px Inter,sans-serif';sp(0,2);c.fillText('ORDER ITEMS',L+16,y+22);sp(0,0);
 c.textAlign='right';c.fillText(o.items.filter(i=>i.s!=='cancelled').length+' item'+(o.items.filter(i=>i.s!=='cancelled').length===1?'':'s'),R-16,y+22);
 y+=54;
 const items=o.items.filter(i=>i.s!=='cancelled');
 items.forEach((i,k)=>{
  c.font='600 15px Inter,sans-serif';const ls=wrapT(c,i.n,IW-170),h=Math.max(44,ls.length*21+12);
  c.fillStyle='#fff3ea';rr(c,L,y-20,42,30,9);c.fill();c.fillStyle=OR;c.textAlign='center';c.font='700 14px Inter,sans-serif';c.fillText(i.q+'×',L+21,y);
  c.textAlign='left';c.fillStyle=INK;c.font='600 15px Inter,sans-serif';ls.forEach((t,j)=>c.fillText(t,L+58,y+j*21));
  c.textAlign='right';c.font='700 15px Inter,sans-serif';c.fillText(fmt(i.q*i.p),R,y);
  if(i.q>1){c.fillStyle=MUT;c.font='400 12px Inter,sans-serif';c.fillText(fmt(i.p)+' each',R,y+19)}
  y+=h+ (i.q>1?4:0);
  if(k<items.length-1){c.strokeStyle='#eee';c.lineWidth=1.5;c.beginPath();c.moveTo(L,y-14);c.lineTo(R,y-14);c.stroke()}
 });
 y+=6;
 const sub=Math.max(0,o.total-o.fee);
 const row=(t,v2)=>{c.textAlign='left';c.fillStyle=MUT;c.font='500 14.5px Inter,sans-serif';c.fillText(t,L,y);c.textAlign='right';c.fillStyle=INK;c.font='600 14.5px Inter,sans-serif';c.fillText(v2,R,y);y+=28};
 row('Subtotal',fmt(sub));row('Delivery fee',fmt(o.fee));
 y+=2;c.fillStyle='#fff3ea';rr(c,L,y,IW,68,16);c.fill();
 c.fillStyle=INK;c.textAlign='left';c.font='700 16px Sora,Inter,sans-serif';c.fillText(o.paid?'TOTAL PAID':'TOTAL',L+20,y+41);
 c.fillStyle=OR;c.textAlign='right';c.font='700 26px Sora,Inter,sans-serif';c.fillText(fmt(o.total),R-20,y+43);
 y+=68+40;
 tear(y);y+=46;
 /* footer */
 c.textAlign='center';c.fillStyle=INK;c.font='600 18px Sora,Inter,sans-serif';c.fillText('Thank you for shopping on KAMPZA',W/2,y);
 y+=26;c.fillStyle=MUT;c.font='400 13.5px Inter,sans-serif';c.fillText('Questions about your order? '+SUPPORT_EMAIL,W/2,y);
 y+=34;
 /* barcode */
 const code=String(o.id),bw=[];for(let i=0;i<code.length*4+10;i++){const ch=code.charCodeAt(i%code.length)+i*7;bw.push(1+(ch%3))}
 const tw=bw.reduce((a,b)=>a+b*2,0);let bx2=W/2-tw/2;c.fillStyle=INK;
 bw.forEach((w,i)=>{if(i%2===0)c.fillRect(bx2,y,w*2,46);bx2+=w*2});
 y+=46+20;c.fillStyle=MUT;c.font='500 11.5px Inter,sans-serif';sp(0,3);c.fillText(code,W/2+1.5,y);sp(0,0);
 y+=26;c.font='400 11px Inter,sans-serif';c.fillStyle='#a8a8a8';c.fillText('This is a computer-generated receipt and needs no signature.',W/2,y);
 y+=34;
 return y+TOP;}
async function makeReceipt(o){
 try{await Promise.all(['700 30px Sora','600 15px Inter','500 14px Inter','400 14px Inter','700 12px Inter'].map(f=>document.fonts.load(f)))}catch{}
 const W=760,SC=2,s=document.createElement('canvas');s.width=W;s.height=4000;
 const H=Math.ceil(paint(s.getContext('2d'),o,0));
 const cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;
 const c=cv.getContext('2d');c.scale(SC,SC);paint(c,o,H);return cv}
function receiptView(){
 const o=S.orders.find(k=>k.id===RC);
 if(!receiptReady(o))return pgHead('Receipt')+empty('🧾','Your receipt appears here once the vendor approves your payment.');
 return pgHead('Receipt')+`<p class="sub">Your order is successful. Save the receipt as an image or PDF.</p><div class="rcw"><div class="sk" id="rcsk" style="min-height:460px"></div><img id="rcimg" alt="Receipt for ${esc(o.id)}" hidden></div><div class="rcb"><button class="btn" data-rcimg>⬇ Image (PNG)</button><button class="btn alt" data-rcpdf>⬇ PDF</button></div>`}
function pdfFromJpeg(bytes,w,h){
 const pw=420,ph=Math.round(420*h/w),enc=t=>new TextEncoder().encode(t),parts=[],offs=[];let len=0;
 const push=b=>{parts.push(b);len+=b.length};
 const obj=(n,head,stream)=>{offs[n]=len;push(enc(n+' 0 obj\n'+head+(stream?'\nstream\n':'\n')));if(stream){push(stream);push(enc('\nendstream\n'))}push(enc('endobj\n'))};
 push(enc('%PDF-1.4\n'));
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
 obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
 obj(4,`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bytes.length}>>`,bytes);
 const cs=enc(`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`);obj(5,`<</Length ${cs.length}>>`,cs);
 const x=len;let t='xref\n0 6\n0000000000 65535 f \n';for(let n=1;n<=5;n++)t+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
 t+=`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;push(enc(t));
 return new Blob(parts,{type:'application/pdf'});
}

/* ---- download helpers ---- */
function save(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000)}
const toBlob=(cv,type,qlt)=>new Promise(r=>cv.toBlob(r,type,qlt));
async function rcCanvas(){
 const o=S.orders.find(k=>k.id===RC);
 if(!receiptReady(o))return null;
 const key=o.id+'|'+o.total+'|'+o.paid;
 if(!RCV||RCV.key!==key)RCV={key,cv:await makeReceipt(o)};
 return RCV.cv}

/* shows the receipt image once the canvas is drawn (called by view() for pg==='receipt') */
KX.hooks=KX.hooks||{};
KX.hooks.receipt=async()=>{
 const id=RC;
 try{
  const cv=await rcCanvas(),img=$('#rcimg');
  if(!cv||!img||RC!==id)return;
  img.src=cv.toDataURL('image/png');img.hidden=false;
  $('#rcsk')?.remove();
 }catch(err){console.error(err);const sk=$('#rcsk');if(sk)sk.outerHTML='<div class="warn">Could not draw the receipt. Please try again.</div>'}};

/* ---- clicks owned by this block ---- */
document.addEventListener('click',async e=>{
 const g=s=>e.target.closest(s);let x;
 /* open a notification */
 if(x=g('[data-nt]')){
  NT=+x.dataset.nt;
  if(S.notifs[NT]){S.notifs[NT].r=1;store();badges()}
  pg='notif';draw();return}
 /* open a receipt */
 if(x=g('[data-rc]')){RC=x.dataset.rc;pg='receipt';draw();return}
 /* download receipt as PNG */
 if(g('[data-rcimg]')){
  try{
   const cv=await rcCanvas();if(!cv){toast('Receipt not ready yet');return}
   save(await toBlob(cv,'image/png'),'KAMPZA-receipt-'+RC+'.png');
  }catch(err){console.error(err);toast('Could not save the image')}
  return}
 /* download receipt as PDF */
 if(g('[data-rcpdf]')){
  try{
   const cv=await rcCanvas();if(!cv){toast('Receipt not ready yet');return}
   const bin=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),by=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
   save(pdfFromJpeg(by,cv.width,cv.height),'KAMPZA-receipt-'+RC+'.pdf');
  }catch(err){console.error(err);toast('Could not save the PDF')}
  return}
 /* "I have paid": tell each vendor who is still unpaid that the transfer was sent */
 if(x=g('[data-ipaid]')){
  const code=x.dataset.ipaid,label=x.textContent;
  x.disabled=true;x.textContent='Sending…';
  try{
   const{data,error}=await sb.rpc('order_pay_info',{p_code:code});
   if(error)throw error;
   const vs=((data&&data.vendors)||[]).filter(v=>v.pay_status==='unpaid'||v.pay_status==='rejected');
   if(!vs.length)throw new Error('Nothing left to confirm for this order');
   for(const v of vs){const r=await sb.rpc('submit_transfer',{p_code:code,p_vendor:v.vendor_id});if(r.error)throw r.error}
   notif('Payment submitted',`Order ${code}: waiting for the vendor to approve your transfer.`,code);
   toast('Submitted. The vendor will confirm your payment');
   await loadServer();view();
  }catch(err){toast(err.message||'Could not submit your payment');x.disabled=false;x.textContent=label}
  return}
});

/* expose to the main script (it calls KZR.* lazily) */
window.KZR={stBadge,payBtns,rcBtn,notifView,receiptView,paidNow};
})();

/* ================= START ================= */
boot();
</script>
