<title>KAMPZA Admin | Marketplace Control Centre</title>

<style>
:root{--o:#FF7628;--o2:#e5600f;--c:#252525;--g:#F4F4F4;--w:#fff;--line:#e4e4e4;--mut:#777;--ok:#1f9d55;--bad:#d64545;--warn:#b86e00;--info:#2b6cb0;--sb:236px;--sh:0 1px 3px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--g);color:var(--c);min-height:100dvh}
h1,h2,h3,.sora{font-family:Sora,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.logo{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block}
aside{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--c);color:#fff;display:flex;flex-direction:column;padding:16px 10px calc(14px + env(safe-area-inset-bottom));z-index:60;transition:transform .2s;overflow-y:auto}
.bd{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font:700 19px Sora}
aside button.n{display:flex;gap:10px;align-items:center;width:100%;background:none;color:#bdbdbd;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600;min-height:44px}
aside button.n:hover{background:#303030}aside button.n.on{background:var(--o);color:#fff}
aside .g{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 4px}
aside .out{margin-top:auto;color:#ff9a9a}
header{position:fixed;top:0;left:var(--sb);right:0;height:60px;background:var(--w);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;padding-top:env(safe-area-inset-top);z-index:40;box-sizing:content-box}
header h1{font-size:17px}#burger{display:none;background:none;font-size:22px;padding:8px;min-width:44px;min-height:44px}
header .gs{margin-left:auto;max-width:260px;width:40%}
main{margin-left:var(--sb);padding:80px 20px 40px;padding-top:calc(80px + env(safe-area-inset-top));max-width:1180px}
#scrim{display:none}
.card{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--o)}.stat b{display:block;font:700 22px Sora;margin-top:4px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--w);min-height:42px}
.btn{background:var(--o);color:#fff;border-radius:9px;padding:10px 14px;font-weight:600;min-height:42px}.btn:hover{background:var(--o2)}
.btn.alt{background:var(--w);color:var(--c);border:1px solid var(--line)}.btn.red{background:var(--bad)}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{background:var(--w);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:600;font-size:13px}.chip.on{background:var(--o);border-color:var(--o);color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g);white-space:nowrap}
.pill.ok{background:#e3f6ea;color:var(--ok)}.pill.warn{background:#fff1dc;color:var(--warn)}.pill.bad{background:#fde8e8;color:var(--bad)}.pill.info{background:#e6effa;color:var(--info)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 12px}h2{font-size:18px;margin:2px 0 12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:10px}.bars i{flex:1;background:var(--o);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}.bars i:hover{opacity:1}
.hb{height:8px;background:var(--g);border-radius:9px;overflow:hidden;margin:3px 0 9px}.hb i{display:block;height:100%;background:var(--o)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:90vw}#toast.show{opacity:1}
.lock{position:fixed;inset:0;background:var(--c);color:#fff;display:grid;place-items:center;padding:24px;z-index:100;overflow-y:auto}.lock[hidden]{display:none}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:320px}.lock .logo{width:84px;height:84px;border-radius:20px;margin-bottom:10px}
.lock h2{margin:0;font-size:22px}.lock .sub{color:#bbb;min-height:1.4em;text-align:center}.lock .sub.err{color:#ff9a9a}
.dots{display:flex;gap:16px;margin:22px 0}.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}.dot.on{background:var(--o);border-color:var(--o)}.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:24px}
.pad button:active{background:var(--o)}.pad button:disabled{opacity:.4}.pad .ghost{background:none;border-color:transparent;font-size:17px;color:#bbb}
body.locked>aside,body.locked>header,body.locked>main{display:none}
@media(max-width:860px){
 aside{transform:translateX(-100%);width:270px}body.open aside{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
 header{left:0;padding:0 12px;padding-top:env(safe-area-inset-top)}#burger{display:block}header .gs{width:50%}
 main{margin-left:0;padding-left:12px;padding-right:12px}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}
}
@media print{aside,header,.noprint{display:none!important}main{margin:0;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   KAMPZA ADMIN 2.0 — visual system and responsive structure
   ========================================================= */
:root{
 --o:#ff7628;--o2:#e96518;--c:#252525;--g:#f5f6f8;--w:#fff;
 --line:#e9ebef;--mut:#7b8492;--ok:#168653;--bad:#d74747;--warn:#b97816;--info:#326db2;
 --sb:258px;--sh:0 2px 8px rgba(24,32,45,.035),0 12px 30px rgba(24,32,45,.045);
 --radius:16px;
}
html{scroll-behavior:smooth}
body{background:#f5f6f8;color:#252a31;font-size:13.5px;letter-spacing:-.01em}
h1,h2,h3,.sora{font-family:Sora,Inter,sans-serif;letter-spacing:-.035em}
button,input,select,textarea{font-family:Inter,system-ui,sans-serif}
aside#nav{
 width:var(--sb);padding:24px 15px 16px;background:#202124;color:#fff;
 border-right:1px solid rgba(255,255,255,.06);box-shadow:8px 0 28px rgba(22,24,28,.04);
}
.brand-lockup{display:flex;align-items:center;gap:12px;padding:0 10px 28px}
.brand-lockup .logo{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#fff}
.brand-name{font:700 18px Sora,sans-serif;letter-spacing:-.04em;color:#fff}
.brand-caption{font:600 8px Inter,sans-serif;letter-spacing:.16em;color:#92959b;margin-top:3px}
.nav-group{margin-bottom:13px}
aside .g{font-size:9px;font-weight:700;color:#858990;letter-spacing:.15em;padding:10px 12px 8px}
aside button.n{
 position:relative;gap:12px;padding:11px 12px;margin:2px 0;min-height:44px;border-radius:10px;
 color:#b9bdc4;font-size:12.5px;font-weight:550;transition:background .18s,color .18s,transform .18s;
}
aside button.n:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
aside button.n.on{background:rgba(255,118,40,.16);color:#ff9a61;box-shadow:inset 3px 0 #ff7628}
.nav-ico{width:20px;height:20px;display:grid;place-items:center;font-size:17px;flex:none}
.nav-hint{margin-left:auto;font-size:9px;color:#858990;font-weight:600}
.sidebar-bottom{margin-top:auto;padding-top:18px}
.sidebar-note{display:flex;align-items:center;gap:10px;margin:0 5px 12px;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.035)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#39bd79;box-shadow:0 0 0 4px rgba(57,189,121,.12)}
.sidebar-note b,.sidebar-note small{display:block}
.sidebar-note b{font-size:10px;color:#e8e9eb}
.sidebar-note small{font-size:9px;color:#858990;margin-top:3px}
aside .out{color:#ffaaa4!important;margin-top:5px}
.sidebar-version{font-size:8px;letter-spacing:.12em;color:#696d74;padding:14px 10px 0}
header{
 left:var(--sb);height:76px;padding:0 34px;background:rgba(255,255,255,.94);
 border-bottom:1px solid #e9ebef;backdrop-filter:blur(16px);box-shadow:0 3px 15px rgba(25,32,45,.025);
}
.header-heading{display:flex;flex-direction:column;gap:3px}
.header-heading .eyebrow{font-size:9px;font-weight:700;letter-spacing:.14em;color:#a0a6b0}
header h1{font-size:18px;font-weight:700;color:#252a31}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:22px}
.global-search{width:min(330px,34vw);height:39px;border:1px solid #e9ebef;background:#f8f9fb;border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px}
.global-search span{font-size:22px;color:#9299a4;line-height:1}
.global-search input{border:0!important;background:transparent!important;min-height:34px!important;padding:0!important;font-size:11px!important;outline:none!important}
.admin-chip{display:flex;align-items:center;gap:9px}
.admin-avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#fff0e8;color:#e96518;font:700 13px Sora}
.admin-chip b,.admin-chip small{display:block}
.admin-chip b{font-size:10px;color:#343942}
.admin-chip small{font-size:9px;color:#9299a4;margin-top:3px}
#burger{display:none}
main{
 margin-left:var(--sb);max-width:none;width:auto;padding:108px 34px 50px;
}
#app{max-width:1440px;margin:0 auto}
.card,.stat{
 background:#fff;border:1px solid #eaecf0;border-radius:15px;padding:19px;
 box-shadow:0 2px 7px rgba(24,32,45,.025);margin-bottom:14px;
}
.card{transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#e0e3e9;box-shadow:0 5px 18px rgba(24,32,45,.045)}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}
.stat{text-align:left;min-height:112px;position:relative;overflow:hidden;cursor:pointer}
.stat:after{content:"";position:absolute;width:54px;height:54px;border-radius:18px;background:#fff1e9;right:15px;top:15px}
.stat:hover{transform:translateY(-2px);border-color:#ffc39f;box-shadow:0 8px 22px rgba(255,118,40,.08)}
.stat .mut{font-size:10px;font-weight:600;color:#8b929d}
.stat b{font:700 23px Sora;margin-top:13px;color:#262a31;position:relative;z-index:1}
.two{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px}
h2{font-size:15px;margin:2px 0 13px;color:#292e36}
.mut{color:#858d99;font-size:10.5px}
.row{gap:10px}
.btn{background:#ff7628;border-radius:9px;padding:10px 15px;font-size:11px;font-weight:700;box-shadow:0 3px 8px rgba(255,118,40,.12);transition:background .18s,transform .18s}
.btn:hover{background:#e96518;transform:translateY(-1px)}
.btn.alt{background:#fff;color:#454b55;border:1px solid #e4e7ec;box-shadow:none}
.btn.alt:hover{background:#f8f9fb;border-color:#cfd4dc}
.btn.red{background:#d74747;box-shadow:none}
input,select,textarea{border:1px solid #e4e7ec;border-radius:9px;padding:10px 12px;background:#fff;min-height:40px;font-size:11px}
input:focus,select:focus,textarea:focus{border-color:#ff9a61;box-shadow:0 0 0 3px rgba(255,118,40,.09);outline:none}
label.mut{font-size:10px;font-weight:600;color:#707987}
label.mut input,label.mut textarea{margin-top:6px}
.chips{gap:7px;margin:12px 0}
.chip{padding:8px 13px;border-color:#e7e9ee;font-size:10px;color:#69717d}
.chip.on{background:#fff0e8;border-color:#ffd2bb;color:#e96518}
.pill{font-size:9px;padding:4px 9px}
.tw{border-radius:14px}
table{min-width:700px}
th,td{padding:13px 11px;border-bottom:1px solid #f0f1f4;font-size:10.5px}
th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#939aa5;background:#fafbfc}
tbody tr:hover{background:#fcfcfd}
td b{font-size:10.5px}
.bars{height:170px;gap:7px;padding-top:10px}
.bars i{background:linear-gradient(180deg,#ff9a61,#ff7628);border-radius:6px 6px 2px 2px;min-width:5px}
.hb{height:6px;background:#f0f1f4}
.hb i{background:#ff7628;border-radius:8px}
.empty{padding:42px 15px;color:#9299a4;font-size:11px}
details.card summary{cursor:pointer;color:#343a43;font-size:12px}
#toast{font-size:11px;box-shadow:0 8px 25px rgba(0,0,0,.18)}
.lock{background:radial-gradient(circle at 50% 35%,#38302b 0,#202124 48%,#171819 100%)}
.lock-in{max-width:340px}
.lock .logo{box-shadow:0 10px 35px rgba(255,118,40,.16)}
.lock h2{font-size:23px}
.lock .sub{font-size:11px}
.pad{gap:12px}
.pad button{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.13);transition:background .15s,transform .15s}
.pad button:hover{background:rgba(255,118,40,.25);transform:scale(1.04)}
@media(min-width:1200px){main{padding-left:46px;padding-right:46px}}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:860px){
 aside#nav{width:278px;padding-top:22px}
 header{left:0;height:68px;padding:0 14px}
 #burger{display:block;border-radius:9px;color:#454b55;font-size:19px}
 .header-heading .eyebrow{font-size:8px}
 header h1{font-size:15px}
 .header-tools{gap:10px}
 .global-search{width:min(42vw,230px);height:36px;padding:0 9px}
 .global-search input{font-size:10px!important}
 .admin-chip{display:none}
 main{margin-left:0;padding:88px 14px 32px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .stat{padding:14px;min-height:98px}
 .stat b{font-size:19px;margin-top:10px}
 .card{padding:15px;border-radius:13px}
 .two{grid-template-columns:1fr;gap:8px}
 .row.sp{gap:8px}
}
@media(max-width:420px){
 .global-search{width:38vw}
 .global-search input::placeholder{color:transparent}
 .header-heading .eyebrow{display:none}
 .stats{gap:8px}
 .stat:after{width:36px;height:36px;border-radius:12px;right:10px;top:10px}
 .stat b{font-size:17px}
}
@media print{main{margin:0;padding:0} .card,.stat{box-shadow:none}}
</style>

 app.innerHTML=`<div class="stats"><div class="stat"><span class="mut">Vendor sales</span><b>${naira(live.reduce((a,i)=>a+earn(i),0))}</b></div><div class="stat"><span class="mut">Commission</span><b>${naira(live.reduce((a,i)=>a+comm(i),0))}</b></div><div class="stat"><span class="mut">Pending payouts</span><b>${naira(ps('pending'))}</b></div><div class="stat"><span class="mut">Paid payouts</span><b>${naira(ps('paid'))}</b></div></div>
 <h2>Earnings by vendor</h2>`+tbl(['Vendor','Sales','Commission','Vendor earnings'],per.map(([id,g,c,e])=>`<tr><td>${esc(vname(id))}</td><td>${naira(g)}</td><td>${naira(c)}</td><td>${naira(e)}</td></tr>`))+
 `<h2>Payouts</h2><p class="mut" style="margin-bottom:8px">Read-only for now. Automatic payouts move real money, so they come in a later phase with duplicate-payment protection.</p>`+tbl(['Created','Vendor','Amount','Status','Reference'],po.data.map(p=>`<tr><td>${when(p.created_at)}</td><td>${esc(vname(p.vendor_id))}</td><td>${naira(p.amount)}</td><td>${pill(p.status)}</td><td class="mut">${esc(p.ref||'—')}</td></tr>`));
},

 await loadBase(true);const {data,error}=await sb.from('wallet_tx').select('*').order('created_at',{ascending:false}).limit(100);if(error)return app.innerHTML=err('wallet history',error);
 app.innerHTML=`<div class="stats"><div class="stat"><span class="mut">Customer balances held</span><b>${naira(users.reduce((a,u)=>a+Number(u.balance||0),0))}</b></div><div class="stat"><span class="mut">Entries shown</span><b>${data.length}</b></div></div><p class="mut" style="margin-bottom:8px">To change a balance, use Adjust wallet on the Customers page. A reason is always required.</p>`+

const pendingNote=`<div class="card"><b>Not connected yet</b><p class="mut" style="margin-top:7px">The database tables for this section don’t exist yet. It needs a reviewed migration before it can store anything, so nothing here is wired up.</p></div>`;

views.promotions=async()=>{app.innerHTML=moduleIntro('Promotions','Manage offers and marketplace growth campaigns.',[['％','Discount codes','Create, schedule, pause and expire coupon codes.'],['✦','Campaigns','Organise promotions by audience and product category.'],['▣','Featured products','Control featured placements and merchandising.'],['↗','Performance','Measure redemptions, revenue and campaign conversion.']])+pendingNote};
views.content=async()=>{app.innerHTML=moduleIntro('Store content','Manage the public-facing marketplace experience.',[['▧','Homepage banners','Create and schedule hero banners and promotional tiles.'],['▤','Categories','Organise marketplace categories and display order.'],['✎','Pages & policies','Edit About, FAQ, Terms, Privacy and vendor policies.'],['⌕','SEO','Manage page titles, descriptions and social previews.']])+pendingNote};
views.staff=async()=>{app.innerHTML=moduleIntro('Staff & permissions','Manage authorised people who operate KAMPZA.',[['♙','Staff accounts','Invite, activate and deactivate admin staff.'],['⬡','Role-based access','Configure Super Admin, Operations, Finance, Support and Marketing permissions.'],['◷','Staff activity','Review sensitive actions by staff member.']])+`<div class="card"><b>Security rule</b><p class="mut" style="margin-top:7px">Do not grant roles from client-side code. Role changes must be authorised and enforced by Supabase RLS or trusted server functions. Only Super Admin should manage privileged roles.</p></div>`+pendingNote};
views.security=async()=>{app.innerHTML=moduleIntro('Security centre','Review access, sessions and sensitive account activity.',[['⬡','Authentication','Preserve the existing PIN-to-Supabase authentication flow.'],['◷','Login history','Review successful and failed admin sign-ins.'],['▣','Active sessions','Inspect and revoke sessions where supported.'],['⚑','Sensitive actions','Require confirmation and server-side authorisation.']])+pendingNote};

views.demo=async()=>{app.innerHTML=`<div class="card"><div class="row sp"><div><div class="mut" style="font-weight:700;letter-spacing:.12em">DATA MAINTENANCE</div><h2 style="font-size:21px;margin:7px 0">Demo Data Centre</h2><p class="mut">Preview and remove records explicitly marked as demo/test data across the KAMPZA marketplace and administration system.</p></div><span class="pill warn">Destructive actions</span></div></div><div class="card"><h2>Before you clear anything</h2><p class="mut">This panel is intentionally fail-closed. It will only delete records through a dedicated, authenticated server-side database function that verifies demo markers and protects genuine users, vendors, orders, financial records and administrator accounts.</p><div class="row" style="margin-top:12px"><button class="btn alt" data-act="demo-preview">Preview demo records</button><button class="btn red" data-act="demo-clear">Clear all demo data</button></div><div id="demo-result" class="mut" style="margin-top:12px">Demo deletion backend is not yet installed. No records have been deleted.</div></div><div class="grid">${[['Customers','Demo customer accounts'],['Vendors','Demo vendor profiles'],['Products','Demo catalogue items'],['Orders','Demo orders and order items'],['Payments','Demo payment test records'],['Wallets','Demo wallet entries'],['Quotes','Demo quote requests'],['Reviews','Demo reviews and ratings'],['Notifications','Demo notification records'],['Admin activity','Demo audit/test events']].map(x=>`<div class="card"><b>${x[0]}</b><p class="mut" style="margin-top:5px">${x[1]}</p><span class="pill info">Preview after backend setup</span></div>`).join('')}</div><div class="card"><b>Data protection policy</b><ul class="mut" style="padding-left:18px;margin-top:8px;line-height:1.9"><li>Only rows explicitly marked as demo/test may be deleted.</li><li>Real financial transactions and payout records are never included in a bulk demo purge.</li><li>Admin accounts, roles, auth users and security settings are protected.</li><li>Deletion runs transactionally with a server-side audit record.</li><li>Preview and exact record counts are required before confirmation.</li></ul></div>`};

const applyTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀':'☾';document.querySelector('meta[name=theme-color]')?.setAttribute('content',t==='dark'?'#131416':'#202124')};
$('#theme').onclick=async()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);const {error}=await sb.auth.updateUser({data:{admin_theme:t}});toast(error?'Theme changed here, but could not be saved: '+error.message:(t==='dark'?'Dark':'Light')+' mode saved to your account')};
async function show(){
 $('#title').textContent=TITLES[tab];document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.body.classList.remove('open');app.innerHTML=sk;
 try{await views[tab]()}catch(e){app.innerHTML=err('this page',e)}
}
const val=(c,k)=>c.querySelector(`[data-f=${k}]`),num=v=>v===''||v==null?null:Number(v);
const SEARCHABLE=['orders','products','stock','people','vendors','activity'];
let t1;document.addEventListener('input',e=>{
 if(e.target.id==='q'||e.target.id==='gs'){const g=e.target.id==='gs';q=e.target.value;clearTimeout(t1);t1=setTimeout(async()=>{if(g&&!SEARCHABLE.includes(tab)){tab='orders';await show()}else await views[tab]();const el=$('#q');if(el&&!g){el.focus();el.setSelectionRange(q.length,q.length)}},300)}});
document.addEventListener('change',async e=>{
 if(e.target.id==='rng'){range=e.target.value;return show()}
 if(e.target.id==='vf'){vf=e.target.value;return show()}
 if(e.target.dataset.act!=='ist')return;const it=e.target.closest('[data-item]'),v=e.target.value;
 if(v==='cancelled'&&!confirm('Mark this vendor item cancelled? This does not refund the customer or restore stock, so do that separately.'))return show();
 const {error}=await sb.from('order_items').update({status:v}).eq('id',it.dataset.item);
 if(error){toast(error.message);return show()}toast('Item marked '+v);audit('order_item_status','order_items',it.dataset.item,{status:v});
});
$('#burger').onclick=()=>document.body.classList.toggle('open');$('#scrim').onclick=()=>document.body.classList.remove('open');
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;q='';$('#gs').value='';return show()}
 if(b.dataset.of){ofilter=b.dataset.of;return show()}
 const act=b.dataset.act;if(!act)return;const row=b.closest('[data-id]');b.disabled=true;
 const fail=async(p,ok,log)=>{const {error}=await p;if(error){toast(error.message);return false}toast(ok);if(log)audit(...log);return true};
 try{
  if(act==='audit-export'){const rows=app._audit||[];csv('kampza-admin-audit.csv',[['Created','Admin','Action','Details'],...rows.map(x=>[x.created_at,x.admin_id||x.actor_id,x.action||x.event,JSON.stringify(x.details||x.metadata||{})])]);}
  else if(act==='demo-preview'){const out=$('#demo-result');out.textContent='Checking secure demo-data preview function…';const {data,error}=await sb.rpc('admin_preview_demo_data');if(error){out.textContent='Not ready: '+error.message+'. No data was changed. Install the verified demo-data database functions after schema review.'}else{out.textContent=JSON.stringify(data,null,2)}}
  else if(act==='demo-clear'){const out=$('#demo-result');const preview=await sb.rpc('admin_preview_demo_data');if(preview.error){out.textContent='Cannot clear data: secure preview function is not installed. No data was changed.';return}const summary=JSON.stringify(preview.data);if(!confirm('You are about to delete ONLY records marked as demo/test. Preview: '+summary+' Continue?'))return;const phrase=prompt('Type CLEAR DEMO DATA to confirm');if(phrase!=='CLEAR DEMO DATA')return toast('Confirmation did not match');out.textContent='Requesting secure deletion…';const {data,error}=await sb.rpc('admin_clear_demo_data',{p_confirmation:'CLEAR DEMO DATA'});if(error){out.textContent='Deletion was not completed: '+error.message}else{out.textContent='Server response: '+JSON.stringify(data);toast('Demo data cleanup request completed')}}
  else if(act==='qsave'){const p=val(row,'price').value,r={status:val(row,'status').value,reply_price:p===''?null:Number(p),reply_note:val(row,'note').value.trim()||null};await fail(sb.from('quotes').update(r).eq('id',row.dataset.id),'Reply saved',['quote_reply','quotes',row.dataset.id,r])}
  else if(act==='psave'){const s=num(val(row,'stock').value),pr=val(row,'price'),r={stock:s};if(!Number.isInteger(s)||s<0){return toast('Stock must be a whole number, 0 or more')}
   if(pr){const n=Number(pr.value);if(!Number.isInteger(n)||n<1)return toast('Price must be a whole number above 0');r.price=n}
   if(await fail(sb.from('products').update(r).eq('id',row.dataset.id),'Saved',['product_update','products',row.dataset.id,r]))show()}
  else if(act==='ptog'){const on=b.dataset.on!=='true';if(await fail(sb.from('products').update({active:on}).eq('id',row.dataset.id),on?'Product is visible':'Product hidden',['product_visibility','products',row.dataset.id,{active:on}]))show()}
  else if(act==='vst'){const s=b.dataset.s;if(s!=='approved'&&!confirm(`Set this vendor to ${s}? They lose seller access while ${s}.`))return;
   if(await fail(sb.from('vendors').update({status:s}).eq('id',row.dataset.id),'Vendor '+s,['vendor_status','vendors',row.dataset.id,{status:s}])){VEND=[];show()}}
  else if(act==='wadj'){const amt=Number(prompt('Amount in ₦ (use a minus to deduct, e.g. -500)',''));if(!amt)return;const note=(prompt('Reason (required, shown in their wallet history)','')||'').trim();if(note.length<3)return toast('A reason is required');
   if(await fail(sb.rpc('admin_adjust_wallet',{p_user:row.dataset.id,p_amount:amt,p_note:note}),'Wallet updated',['wallet_adjust','wallets',row.dataset.id,{amount:amt,note}])){users=[];show()}}
  else if(act==='setsave'){const c=Number($('#s-comm').value),f=Number($('#s-fee').value);if(!(c>=0&&c<=50)||!(f>=0&&f<=100000))return toast('Commission must be 0–50 and delivery 0–100000');
   await fail(sb.from('settings').update({commission_pct:c,delivery_fee:f}).eq('id',1),'Settings saved',['settings_update','settings',1,{commission_pct:c,delivery_fee:f}])}
  else if(act==='oexp')csv('kampza-orders.csv',[['Order','Customer','Phone','Items','Total','Payment','Paid','Status','Date'],...(app._o||[]).map(({o,items})=>[o.code,uname(o.buyer_id),o.phone,items.map(i=>`${i.qty}x ${i.name}`).join('; '),o.total,o.pay_method,o.paid,o.status,o.created_at])]);
  else if(act==='cexp')csv('kampza-customers.csv',[['Name','Email','Wallet','Joined'],...users.map(u=>[u.name,u.email,u.balance,u.joined])]);
  else if(act==='inv'){const x=(app._o||[]).find(z=>z.o.id===row.dataset.id),o=x.o,w=window.open('','_blank');if(w){w.document.write(`<title>Invoice ${esc(o.code)}</title><body style="font:14px Inter,sans-serif;max-width:640px;margin:30px auto"><img src="${LOGO}" width="56" style="border-radius:12px"><h2>KAMPZA — Invoice ${esc(o.code)}</h2><p>${esc(uname(o.buyer_id))} · ${esc(o.phone)}<br>${esc(o.address)}<br>${when(o.created_at)}</p><table width="100%" cellpadding="6" border="1" style="border-collapse:collapse">${x.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.qty)}</td><td>${naira(i.price*i.qty)}</td></tr>`).join('')}<tr><td colspan="2">Delivery</td><td>${naira(o.delivery_fee)}</td></tr><tr><td colspan="2"><b>Total</b></td><td><b>${naira(o.total)}</b></td></tr></table><p>Payment: ${o.pay_method} · ${o.paid?'Paid':'Not yet paid'} · Status: ${esc(o.status)}</p><script>onload=()=>print()<\/script>`);w.document.close()}}
  else if(act==='mtest'||act==='mall'){const subject=$('#m-sub').value.trim(),message=$('#m-msg').value.trim();if(subject.length<3||message.length<5)return toast('Add a subject and a message');if(act==='mall'&&!confirm('Send this to ALL customers now? This cannot be undone.'))return;
   const {data,error}=await sb.functions.invoke('admin-broadcast',{body:{token:session.access_token,subject,message,test:act==='mtest'}});if(error||!data?.ok)toast(data?.error||error?.message||'Could not send');else{toast(`Sent to ${data.sent} of ${data.total}`);audit(act==='mtest'?'email_test':'email_broadcast','email',subject,{sent:data.sent,total:data.total})}}
 }finally{b.disabled=false}
});

async function signOut(){await sb.auth.signOut();location.reload()}$('#out').onclick=signOut;
let pin='',busy=false;const lsub=$('#lsub'),dots=$('#dots');
const paint=()=>dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<pin.length));
const msg=(t,bad)=>{lsub.textContent=t;lsub.classList.toggle('err',!!bad)};
function unlock(){applyTheme(session?.user?.user_metadata?.admin_theme==='light'?'light':'dark');document.body.classList.remove('locked');$('#lock').hidden=true;show()}
async function tryPin(){
 busy=true;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=true);msg('Checking…');let r=null,fail=false;
 try{const {data,error}=await sb.functions.invoke('admin-pin-login',{body:{pin}});r=data;if(error&&!data)fail=true;
  if(r?.ok){let v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'email'});if(v.error)v=await sb.auth.verifyOtp({token_hash:r.token_hash,type:'magiclink'});
   if(v.error||!v.data?.session)fail=true;else{session=v.data.session;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}fail=true}}
 }catch(e){fail=true}
 busy=false;$('#pad').querySelectorAll('button').forEach(b=>b.disabled=false);pin='';paint();dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');
 if(fail||!r)msg('Could not log in. Check your connection and try again.',true);else if(r.locked)msg('Too many wrong tries. Wait '+Math.ceil(r.seconds/60)+' min.',true);else msg('Wrong PIN. '+r.left+' '+(r.left===1?'try':'tries')+' left.',true);
}
function press(d){if(busy||pin.length>=4)return;pin+=d;paint();if(pin.length===4)tryPin()}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.id==='pback')return;press(b.textContent.trim())});
$('#pback').onclick=()=>{if(!busy){pin=pin.slice(0,-1);paint()}};
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace'&&!busy){pin=pin.slice(0,-1);paint()}});
(async()=>{const {data:{session:cur}}=await sb.auth.getSession();if(cur){session=cur;const {data:ok}=await sb.rpc('is_admin');if(ok){sb.auth.onAuthStateChange((_e,s)=>{if(s)session=s});return unlock()}await sb.auth.signOut()}})();

</script></body></html>
